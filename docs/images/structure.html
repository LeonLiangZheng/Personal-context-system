<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>结构图（README 用）</title>
<!-- README 里的结构图源文件：作者库里 System Map.canvas 的简化版。
     改完用浏览器打开看效果；地址后面加 #dark 看深色版。
     README 用的两张图 structure-light.png / structure-dark.png 由这个文件截出（2 倍，透明背景）。 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#1f2328; --muted:#59636e; --line:#8c959f; --card:#ffffff; --card-line:#d1d9e0;
  --a:#1a7f37; --a-bg:#dafbe1; --b:#bc4c00; --b-bg:#fff1e5; --c:#8250df; --c-bg:#fbefff;
  --red:#cf222e; --red-bg:#ffebe9; --hero:#1f2328; --hero-ink:#ffffff;
}
:root.dark{
  --ink:#e6edf3; --muted:#9198a1; --line:#6e7681; --card:#151b23; --card-line:#3d444d;
  --a:#3fb950; --a-bg:#12261e; --b:#db6d28; --b-bg:#2b1d12; --c:#a371f7; --c-bg:#221a33;
  --red:#f85149; --red-bg:#2d1517; --hero:#e6edf3; --hero-ink:#0d1117;
}
html,body{margin:0;background:transparent}
svg{display:block;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.t{fill:var(--ink);font-size:17px;font-weight:700}
.s{fill:var(--muted);font-size:13.5px}
.h{font-size:15px;font-weight:700}
.chip{font-size:15px;font-weight:500;fill:var(--ink)}
.chip small,.en{fill:var(--muted);font-weight:400}
.lbl{fill:var(--muted);font-size:13px}
.arr{stroke:var(--line);stroke-width:1.6;fill:none}
.dash{stroke-dasharray:5 4}
</style>
</head>
<body>
<svg id="map" width="1100" height="744" viewBox="0 0 1100 744" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--line)"/>
    </marker>
  </defs>

  <!-- 入口 -->
  <text x="24" y="44" class="h" style="fill:var(--ink)">入口</text>
  <rect x="24" y="64" width="212" height="70" rx="10" style="fill:var(--card);stroke:var(--card-line)"/>
  <text x="40" y="94" class="t">你说一句话</text>
  <text x="40" y="118" class="s">或丢进 0-Inbox</text>
  <path class="arr" d="M130,134 V170" marker-end="url(#ah)"/>
  <rect x="24" y="172" width="212" height="76" rx="10" style="fill:var(--hero)"/>
  <text x="40" y="203" class="t" style="fill:var(--hero-ink)">AI 判断放哪</text>
  <text x="40" y="228" class="s" style="fill:var(--hero-ink);opacity:.8">按入库 skill，做完再报告</text>
  <path class="arr dash" d="M130,248 V306" marker-end="url(#ah)"/>
  <text x="140" y="282" class="lbl">拿不准</text>
  <rect x="24" y="308" width="212" height="76" rx="10" style="fill:var(--red-bg);stroke:var(--red)"/>
  <text x="40" y="339" class="t">0-Unclear</text>
  <text x="40" y="364" class="s">写成选择题，你勾一下</text>

  <!-- 入口 → A / B -->
  <path class="arr" d="M236,196 H256 V140 H282" marker-end="url(#ah)"/>
  <path class="arr" d="M236,224 H256 V300 H282" marker-end="url(#ah)"/>
  <path class="arr dash" d="M236,346 H282" marker-end="url(#ah)"/>
  <text x="40" y="408" class="lbl">勾选后，归到该去的地方</text>

  <!-- A 执行 -->
  <rect x="284" y="60" width="380" height="164" rx="14" style="fill:var(--a-bg);stroke:var(--a)"/>
  <text x="304" y="92" class="h" style="fill:var(--a)">A 执行</text>
  <text x="364" y="92" class="s">有状态，会结束</text>
  <rect x="304" y="112" width="118" height="40" rx="8" style="fill:var(--card);stroke:var(--card-line)"/>
  <text x="318" y="138" class="chip">项目 <tspan class="en">Projects</tspan></text>
  <rect x="304" y="164" width="118" height="40" rx="8" style="fill:var(--card);stroke:var(--card-line)"/>
  <text x="318" y="190" class="chip">旅行 <tspan class="en">Holidays</tspan></text>
  <path class="arr" d="M422,132 H462 V158 H500" marker-end="url(#ah)"/>
  <path class="arr" d="M422,184 H462 V158"/>
  <text x="430" y="122" class="lbl">结束后</text>
  <rect x="502" y="138" width="142" height="40" rx="8" style="fill:var(--card);stroke:var(--card-line)"/>
  <text x="516" y="164" class="chip">归档 <tspan class="en">Archive</tspan></text>

  <!-- B 记录 -->
  <rect x="284" y="252" width="380" height="338" rx="14" style="fill:var(--b-bg);stroke:var(--b)"/>
  <text x="304" y="284" class="h" style="fill:var(--b)">B 记录</text>
  <text x="364" y="284" class="s">第一手，原话一字不改</text>
  <text x="304" y="318" class="lbl">关于你</text>
  <rect x="304" y="328" width="168" height="40" rx="8" style="fill:var(--card);stroke:var(--card-line)"/>
  <text x="318" y="354" class="chip">情绪 <tspan class="en">Emotions</tspan></text>
  <rect x="484" y="328" width="160" height="40" rx="8" style="fill:var(--card);stroke:var(--card-line)"/>
  <text x="498" y="354" class="chip">想法 <tspan class="en">Insights</tspan></text>
  <rect x="304" y="378" width="340" height="40" rx="8" style="fill:var(--card);stroke:var(--card-line)"/>
  <text x="318" y="404" class="chip">和 AI 的讨论 <tspan class="en">Dialogues</tspan></text>
  <text x="304" y="452" class="lbl">关于事</text>
  <rect x="304" y="462" width="168" height="40" rx="8" style="fill:var(--card);stroke:var(--card-line)"/>
  <text x="318" y="488" class="chip">学习 <tspan class="en">Topics</tspan></text>
  <rect x="484" y="462" width="160" height="40" rx="8" style="fill:var(--card);stroke:var(--card-line)"/>
  <text x="498" y="488" class="chip">作品 <tspan class="en">Tools</tspan></text>
  <rect x="304" y="512" width="168" height="40" rx="8" style="fill:var(--card);stroke:var(--card-line)"/>
  <text x="318" y="538" class="chip">资料 <tspan class="en">Info</tspan></text>
  <rect x="484" y="512" width="160" height="40" rx="8" style="fill:var(--card);stroke:var(--card-line)"/>
  <text x="498" y="538" class="chip">饮食 <tspan class="en">Meals</tspan></text>

  <!-- A/B → C -->
  <path class="arr" d="M664,150 H722" marker-end="url(#ah)"/>
  <text x="670" y="140" class="lbl">季度原料</text>
  <path class="arr" d="M664,340 H722" marker-end="url(#ah)"/>
  <text x="678" y="330" class="lbl">证据</text>
  <path class="arr" d="M664,482 H722" marker-end="url(#ah)"/>
  <text x="678" y="472" class="lbl">原料</text>

  <!-- C 提炼 -->
  <rect x="724" y="60" width="352" height="530" rx="14" style="fill:var(--c-bg);stroke:var(--c)"/>
  <text x="744" y="92" class="h" style="fill:var(--c)">C 提炼</text>
  <text x="804" y="92" class="s">AI 每周巡检时做，可重跑</text>
  <rect x="744" y="118" width="312" height="62" rx="8" style="fill:var(--card);stroke:var(--card-line)"/>
  <text x="760" y="145" class="chip">季度回忆录 <tspan class="en">Memoirs</tspan></text>
  <text x="760" y="168" class="s">这三个月做了什么、去了哪、想通了什么</text>
  <rect x="744" y="200" width="312" height="44" rx="8" style="fill:var(--card);stroke:var(--card-line)"/>
  <text x="760" y="228" class="chip">情境 <tspan class="en">Situations</tspan></text>
  <path class="arr" d="M900,246 V270" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="744" y="272" width="312" height="124" rx="8" style="fill:var(--card);stroke:var(--c);stroke-width:1.6"/>
  <text x="760" y="300" class="chip">应对策略 <tspan class="en">Strategies</tspan></text>
  <text x="760" y="326" class="s">识别信号、机制、下次怎么做；</text>
  <text x="760" y="346" class="s">每条都能追溯到具体事件</text>
  <text x="760" y="378" class="s" style="fill:var(--c)">例：把论文拆到 25 分钟能开工的大小</text>
  <rect x="744" y="440" width="312" height="62" rx="8" style="fill:var(--card);stroke:var(--card-line)"/>
  <text x="760" y="467" class="chip">知识体系 <tspan class="en">Knowledge</tspan></text>
  <text x="760" y="490" class="s">把零散的学习理出主线和关系</text>
  <rect x="744" y="516" width="312" height="58" rx="8" style="fill:var(--hero)"/>
  <text x="760" y="541" class="chip" style="fill:var(--hero-ink)">侧写 C-WhoRU</text>
  <text x="760" y="563" class="s" style="fill:var(--hero-ink);opacity:.8">任何 AI 打开库，先读这一页</text>

  <!-- 底部：管着全库的 -->
  <text x="24" y="636" class="h" style="fill:var(--ink)">管着全库的</text>
  <g>
    <rect x="24" y="652" width="251" height="72" rx="10" style="fill:var(--card);stroke:var(--card-line)"/>
    <text x="40" y="680" class="chip">CLAUDE.md</text>
    <text x="40" y="704" class="s">规则；AGENTS.md 是副本</text>
    <rect x="291" y="652" width="251" height="72" rx="10" style="fill:var(--card);stroke:var(--card-line)"/>
    <text x="307" y="680" class="chip">两个 skill</text>
    <text x="307" y="704" class="s">入库、巡检的具体步骤</text>
    <rect x="558" y="652" width="251" height="72" rx="10" style="fill:var(--card);stroke:var(--card-line)"/>
    <text x="574" y="680" class="chip">定时任务</text>
    <text x="574" y="704" class="s">每天 08:00 晨报，每周巡检</text>
    <rect x="825" y="652" width="251" height="72" rx="10" style="fill:var(--card);stroke:var(--card-line)"/>
    <text x="841" y="680" class="chip">看板</text>
    <text x="841" y="704" class="s">浏览器只读，只列事实</text>
  </g>
</svg>
<script>if(location.hash==='#dark')document.documentElement.classList.add('dark');</script>
</body>
</html>
