<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>驾驶舱</title>
<style>
/* ---------- tokens（参考色板：dataviz reference palette，light / dark 各自选定） ---------- */
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f1f0ec;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834;                       /* 分类色 slot 1 / 2 */
  --seq0:#ecebe6; --seq1:#cde2fb; --seq2:#9ec5f4; --seq3:#5598e7; --seq4:#256abf; --seq5:#0d366b; /* 顺序色：蓝，浅→深 */
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;  /* 状态色，只表状态 */
  --wash:rgba(42,120,214,.08); --link:#1c5cab;
  --shadow:0 1px 2px rgba(0,0,0,.04);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#242422;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926;
  --seq0:#262624; --seq1:#184f95; --seq2:#256abf; --seq3:#3987e5; --seq4:#6da7ec; --seq5:#b7d3f6; /* 暗色：近零沉向表面 */
  --wash:rgba(57,135,229,.12); --link:#86b6ef;
  --shadow:none;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--axis)}
.wrap{max-width:1280px;margin:0 auto;padding:28px 28px 64px}
.muted{color:var(--muted)} .small{font-size:12px}
.wl{color:var(--link)}
code{font-family:ui-monospace,Consolas,monospace;font-size:.92em;background:var(--surface-2);padding:0 4px;border-radius:4px}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.title{font-size:22px;font-weight:650;letter-spacing:.2px}
.sub{color:var(--ink-2);margin-top:2px}
.actions{display:flex;align-items:center;gap:8px}
.status{color:var(--muted);font-size:12px;margin-right:6px}
.btn{font:inherit;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:9px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--s1);border-color:transparent;color:#fff;padding:9px 16px}
.btn.primary:hover{filter:brightness(1.07)}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.banner{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--critical);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px}

/* ---------- layout ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card h3 .hint{font-weight:400;color:var(--muted);font-size:12px;text-align:right}
section{margin-top:28px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 12px;flex-wrap:wrap}
.sec-head h2{margin:0;font-size:16px;font-weight:650}
.stack{display:flex;flex-direction:column;gap:12px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;align-items:start}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1080px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-2,.grid-3{grid-template-columns:minmax(0,1fr)}}

/* ---------- tiles ---------- */
.tile .label{font-size:12px;color:var(--ink-2)}
.tile .value{font-size:30px;font-weight:600;line-height:1.2;margin-top:6px}
.tile .foot{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- status（色点 + 符号 + 文字，从不只靠颜色） ---------- */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.st::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
.st.crit{--c:var(--critical)} .st.serious{--c:var(--serious)} .st.warn{--c:var(--warn)} .st.good{--c:var(--good)} .st.idle{--c:var(--axis)}
.chip{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:1px 8px;white-space:nowrap}

/* ---------- deadline ---------- */
.hero-next{padding:12px 14px;border-radius:10px;background:var(--surface-2);margin-bottom:4px}
.hero-next .hero-text{font-size:15px;font-weight:500;margin:2px 0 3px;line-height:1.45}
.dl-group-title{font-size:12px;color:var(--muted);margin:16px 0 2px}
.dl-row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--grid)}
.dl-row .st{padding-top:2px}
.dl-text{line-height:1.45}
.dl-proj{font-size:12px;color:var(--muted);margin-top:2px}
.more summary{cursor:pointer;font-size:12px;color:var(--muted);padding:6px 0;list-style:none}
.more summary::-webkit-details-marker{display:none}
.empty{color:var(--muted);font-size:13px;margin:4px 0}

/* ---------- debt ---------- */
.debt details,.debt .row{border-top:1px solid var(--grid)}
.debt > :first-child{border-top:0}
.debt summary,.debt .row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;list-style:none}
.debt summary{cursor:pointer}
.debt summary::-webkit-details-marker{display:none}
.debt summary:hover .what{color:var(--ink)}
.debt .n{font-size:22px;font-weight:600;line-height:1}
.debt .n.zero{color:var(--muted)}
.debt .what{line-height:1.4;color:var(--ink)} .debt .what small{display:block;color:var(--muted);font-size:12px}
.debt .chev{color:var(--muted);font-size:12px;transition:transform .15s}
.debt details[open] .chev{transform:rotate(90deg)}
.debt ul{margin:0 0 10px 56px;padding:0;list-style:none;font-size:12.5px;color:var(--ink-2)}
.debt ul li{padding:3px 0;display:flex;justify-content:space-between;gap:12px}
.debt ul li span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- strategy grades / profile ---------- */
.gr-sum{display:flex;flex-wrap:wrap;gap:6px 14px;margin:-2px 0 6px}
.gr-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-top:1px solid var(--grid)}
.gr-name{line-height:1.45}
.gr-sub{grid-column:1 / -1;font-size:12px;color:var(--muted);margin-top:-2px;font-variant-numeric:tabular-nums}
.gr-sub .bad{color:var(--serious)}

/* ---------- projects ---------- */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.proj{display:flex;flex-direction:column;gap:10px}
.proj.stale{box-shadow:inset 3px 0 0 var(--serious)}
.proj-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.proj-name{font-weight:600;font-size:15px;line-height:1.35}
.proj-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.prog{height:4px;border-radius:4px;background:var(--grid);overflow:hidden}
.prog i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.prog-l{font-size:11.5px;color:var(--muted);margin-top:-5px}
.proj-log{font-size:12.5px;color:var(--ink-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.proj-log .d{color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.proj-next{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.proj-next li{font-size:12.5px;padding-left:18px;position:relative;line-height:1.45}
.proj-next li::before{content:"";position:absolute;left:1px;top:5px;width:9px;height:9px;border:1.5px solid var(--axis);border-radius:3px}
.proj-next li > div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- segmented filter ---------- */
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--ink-2);padding:4px 11px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.10)}

/* ---------- heatmap ---------- */
.hm-wrap{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.hm{--cell:13px;display:grid;grid-template-columns:18px auto;gap:6px;min-width:0;max-width:100%}
.hm-scroll{overflow-x:auto;padding-bottom:2px}
.hm-days{display:grid;grid-template-rows:repeat(7,var(--cell));gap:3px;font-size:10px;line-height:var(--cell);color:var(--muted);margin-top:18px}
.hm-months{display:grid;grid-auto-flow:column;grid-auto-columns:var(--cell);gap:3px;font-size:10.5px;color:var(--muted);height:15px;margin-bottom:3px}
.hm-months span{white-space:nowrap;overflow:visible}
.hm-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,var(--cell));grid-auto-columns:var(--cell);gap:3px}
.hm-grid i{border-radius:3px;background:var(--seq0)}
.hm-grid i.b1{background:var(--seq1)} .hm-grid i.b2{background:var(--seq2)} .hm-grid i.b3{background:var(--seq3)} .hm-grid i.b4{background:var(--seq4)} .hm-grid i.b5{background:var(--seq5)}
.hm-grid i.fut{background:transparent}
.hm-grid i.today{outline:1.5px solid var(--ink);outline-offset:1px}
.hm-grid i:not(.fut):hover{outline:1.5px solid var(--ink-2);outline-offset:1px}
.hm-legend{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);margin-top:10px}
.hm-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.hm-stats{display:grid;grid-template-columns:repeat(2,auto);gap:14px 28px;align-content:start;padding-top:18px}
.hm-stats .v{font-size:22px;font-weight:600;line-height:1.2}
.hm-stats .l{font-size:12px;color:var(--muted)}

/* ---------- horizontal bars ---------- */
.hbars{display:flex;flex-direction:column;gap:4px}
.hb-row{display:grid;grid-template-columns:var(--lw,56px) minmax(0,1fr) 30px;align-items:center;gap:8px;font-size:12px;border-radius:6px;padding:2px 4px;margin:0 -4px}
.hb-row:hover,.hb-row:focus-visible{background:var(--wash);outline:none}
.hb-label{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-track{height:18px;position:relative;border-left:1px solid var(--axis)}
.hb-track i{position:absolute;left:0;top:4px;height:10px;background:var(--s1);border-radius:0 4px 4px 0}
.hb-val{color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}

/* ---------- grouped vertical bars ---------- */
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin:-2px 0 12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.vc{display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:6px}
.vc-y{position:relative;height:150px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.vc-y span{position:absolute;right:0;transform:translateY(50%)}
.vc-plot{position:relative;height:150px;border-bottom:1px solid var(--axis)}
.vc-plot .gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.vc-groups{position:absolute;inset:0;display:flex;align-items:flex-end;gap:4px}
.vc-g{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;border-radius:6px 6px 0 0;cursor:default}
.vc-g:hover,.vc-g:focus-visible{background:var(--wash);outline:none}
.vc-g i{width:min(14px,38%);border-radius:4px 4px 0 0;background:var(--s1)}
.vc-g i.b{background:var(--s2)}
.vc-x{grid-column:2;display:flex;gap:4px;font-size:10.5px;color:var(--muted);margin-top:5px}
.vc-x span{flex:1;text-align:center;white-space:nowrap}

/* ---------- table view（每个图都有） ---------- */
details.tv{margin-top:12px;font-size:12px;color:var(--muted)}
details.tv summary{cursor:pointer;width:max-content}
details.tv table{border-collapse:collapse;margin-top:8px;width:100%;font-variant-numeric:tabular-nums}
details.tv td,details.tv th{text-align:left;padding:4px 8px 4px 0;border-top:1px solid var(--grid);color:var(--ink-2);font-weight:400;vertical-align:top}
details.tv th{color:var(--muted)}

/* ---------- recent moods ---------- */
.moods{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
@media (max-width:1080px){.moods{grid-template-columns:minmax(0,1fr)}}
.moods li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--grid)}
.moods .d{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:1px}
.moods .t{line-height:1.45}
.moods .e{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}

/* ---------- health ---------- */
.check{border-top:1px solid var(--grid)}
.check:first-child{border-top:0}
.check summary{list-style:none;display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;padding:10px 0;align-items:center}
.check.has summary{cursor:pointer}
.check summary::-webkit-details-marker{display:none}
.check .desc small{display:block;color:var(--muted);font-size:12px}
.check .chev{color:var(--muted);font-size:12px;transition:transform .15s}
.check[open] .chev{transform:rotate(90deg)}
.check ul{margin:0 0 12px 104px;padding:0;list-style:none;font-size:12.5px;color:var(--ink-2);columns:2;column-gap:28px}
.check ul li{break-inside:avoid;padding:2px 0}
@media (max-width:1080px){.check ul{columns:1;margin-left:0}}

/* ---------- connect ---------- */
.connect{max-width:560px;margin:9vh auto 0}
.connect h1{font-size:24px;margin:0 0 10px;font-weight:650}
.connect p{color:var(--ink-2);margin:0 0 14px}
.connect ul{color:var(--ink-2);padding-left:18px;margin:0 0 22px}
.connect .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- tooltip ---------- */
#tip{position:fixed;z-index:50;left:0;top:0;pointer-events:none;max-width:340px;background:var(--ink);color:var(--page);font-size:12px;line-height:1.55;padding:8px 10px;border-radius:8px;opacity:0;transition:opacity .1s;box-shadow:0 6px 24px rgba(0,0,0,.2)}
#tip.on{opacity:1}
#tip b{font-weight:600}
#tip .m{opacity:.72}

body.busy #main{opacity:.55;transition:opacity .2s}
[hidden]{display:none!important}
/* ---------- 示例说明 ---------- */
.intro{display:grid;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-bottom:6px}
.intro p{margin:0;color:var(--ink-2);max-width:72ch}
.intro .feats{display:flex;flex-wrap:wrap;gap:8px}
.intro .feats a{font-size:12.5px;border:1px solid var(--border);border-radius:999px;padding:3px 12px;color:var(--ink)}
.intro .feats a:hover{background:var(--wash);text-decoration:none}
.intro .feats b{color:var(--s1);font-weight:600;margin-right:4px}
/* ---------- 证据链 ---------- */
.ev-strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ev-strip button{font:inherit;font-size:12.5px;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer}
.ev-strip button.on{background:var(--ink);color:var(--page);border-color:var(--ink)}
.ev-graph{overflow-x:auto}
.ev-graph svg{display:block;width:100%;max-width:900px;margin:0 auto;height:auto}
.ev-graph .colh{font-size:12px;fill:var(--muted);letter-spacing:.06em}
.ev-graph .e{fill:none;stroke:var(--grid);stroke-width:1.2}
.ev-graph .e.dim{opacity:.45}
.ev-graph .e.hot{stroke-width:2.2}
.ev-graph .e.path{stroke:var(--s1)} .ev-graph .e.ok{stroke:var(--good)} .ev-graph .e.bad{stroke:var(--critical)} .ev-graph .e.seen{stroke:var(--muted);stroke-dasharray:4 4}
.ev-graph .n{cursor:pointer}
.ev-graph .n text{font-size:12.5px;fill:var(--ink)}
.ev-graph .n circle{fill:var(--surface);stroke:var(--muted);stroke-width:1.4}
.ev-graph .n.sit{cursor:default} .ev-graph .n.sit circle{fill:var(--wash);stroke:var(--s1)}
.ev-graph .n.dim text,.ev-graph .n.dim circle{opacity:.3}
.ev-graph .n.on text{font-weight:650}
.ev-graph .n.ok circle{fill:var(--good);stroke:var(--good)} .ev-graph .n.bad circle{fill:var(--critical);stroke:var(--critical)} .ev-graph .n.seen circle{stroke-dasharray:2 2}
.ev-graph .n:not(.sit):hover text{fill:var(--link)}
.ev-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.ev-legend i{display:inline-block;width:18px;border-top:2px solid;vertical-align:middle;margin-right:5px}
.ev-detail{display:grid;gap:10px;border-top:1px solid var(--grid);margin-top:14px;padding-top:16px}
@media (min-width:861px){.ev-detail{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);column-gap:36px;align-items:start}.ev-detail > *{grid-column:1}.ev-detail > .ev-list{grid-column:2;grid-row:1/span 9}}
@media (max-width:640px){.ev-graph,.ev-legend{display:none}.ev-detail{border-top:0;margin-top:0;padding-top:0}}
.ev-detail h4{margin:0;font-size:17px;font-weight:650}
.ev-detail p{margin:0}
.ev-counts{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.ev-counts b{font-size:18px;font-weight:600;color:var(--ink);margin-right:3px;font-variant-numeric:tabular-nums}
.ev-why{font-size:13px;color:var(--ink-2);border-left:2px solid var(--grid);padding-left:10px}
.ev-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ev-list li{display:grid;gap:2px;padding-top:10px;border-top:1px solid var(--grid)}
.ev-list li:first-child{border-top:0;padding-top:0}
.ev-meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev-res{font-size:11.5px;padding:0 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}
.ev-res.ok{color:var(--good)} .ev-res.bad{color:var(--critical)}
.ev-q{font-size:13.5px;color:var(--ink-2)}
.pf-list{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:7px;font-size:13px}
.pf-list li{padding-left:12px;position:relative}
.pf-list li::before{content:"";position:absolute;left:0;top:.65em;width:5px;height:5px;border-radius:50%;background:var(--s1)}
.pf-list .src{color:var(--muted);font-size:12px}
details.fold{margin-top:36px;border-top:1px solid var(--grid);padding-top:14px}
details.fold > summary{cursor:pointer;font-size:14px;font-weight:600;list-style:none;color:var(--ink-2)}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary span{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
details.fold > .card{margin-top:14px}
.actions{flex-wrap:wrap}.actions .btn{white-space:nowrap}
@media (max-width:640px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
footer{margin-top:40px;color:var(--muted);font-size:12px;line-height:1.7}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="title" id="title">驾驶舱</div>
      <div class="sub" id="sub">&nbsp;</div>
    </div>
    <div class="actions">
      <span id="status" class="status"></span>
      <button id="btn-open" class="btn" hidden>打开我的库</button>
      <button id="btn-refresh" class="btn" title="重新读取数据库（切回本页时也会自动刷新）">↻ 刷新</button>
      <button id="btn-theme" class="btn" title="主题">◐ 自动</button>

画像改动**：新增“做选择时会列很长的优缺点清单”“心里早有倾向，列清单是在找理由（AI 判断）”“室友话题：先说需求的说法目前存疑”三条；“组会前紧张”补上 9 月 16 日的来源；“刚开始跑步”改为“已能不停跑 5 公里”。\n- **格式问题**：无。\n\n### 2026-09-26\n按用户要求，把和 AI 讨论实习选择时提到的办法整理成 [[两个选项都不差时给决定设截止日期]]，等级 ⚪ 待验证。\n\n### 2026-09-01 · 巡检\n- **范围**：上次巡检 2026-08-01 之后新增或更新的 B 层文件，共 6 个：[[跟阿凯说了想十二点以后安静点]]、[[第一次不停跑完五公里]]、[[数据清洗拆成小块两天就做完了]]、[[三句话写出来以后 PPT 只是配图]]、[[《原子习惯》读书笔记]]、[[跑步入门的心率区间]]。\n- **归入已有 C 文件**：[[三句话写出来以后 PPT 只是配图]] → [[组会前先写三句话结论]] 证据栏（第 1 步）；[[第一次不停跑完五公里]] → [[自我价值与意义感]] 洞见综述；[[跟阿凯说了想十二点以后安静点]]、[[数据清洗拆成小块两天就做完了]] 在 8 月按用户要求建策略时已用过。\n- **提议**：跑步相关原料可以合成一个知识体系，用户同意后新建 [[跑步入门]]。\n- **等级变化**：[[组会前先写三句话结论]] 支持 1 → 2，仍 🟡，缺第 2 步。\n- **画像改动**：新增“8 月开始跑步”“拆小后开工很快”两条。\n- **格式问题**：无。\n\n### 2026-08-19\n按用户要求新建 [[把论文拆到 25 分钟能开工的大小]]，证据 2 条，等级 🟡。\n\n### 2026-08-08\n按用户要求新建 [[室友摩擦先说需求再说事实]]，证据 1 条，等级 🟡。\n\n### 2026-08-01 · 巡检\n- **范围**：没有上次巡检记录，做全量：[[对着空白的文献综述坐了一下午]]、[[组会前一晚改 PPT 改到一点]]、[[提示词怎么写得更具体]]。\n- **归入已有 C 文件**：[[对着空白的文献综述坐了一下午]] → [[启动-执行]] 洞见综述；[[组会前一晚改 PPT 改到一点]] 在 7 月 22 日建策略时已用过。\n- **新建**：[[C-WhoRU]]，写第一版画像。\n- **格式问题**：无。\n\n### 2026-07-22\n按用户要求，把师姐小钟教的办法整理成 [[组会前先写三句话结论]]，等级 🟡，缺第 2 步。\n\n### 2026-07-01\n**搭库**。建好目录，放入 CLAUDE.md 和 AGENTS.md；建了五个活项目；6 月结题的 [[课程项目-信号灯配时优化]] 直接建在 A-Archive。\n\n## 关联链接\n**goal**：[[终身学习]]\n- [[B-Tools/Obsidian/Cockpit-Web/README|Cockpit-Web]] —— 这个库的看板\n- [[C-WhoRU]] —— 画像每月随巡检重写\n- [[2026-Q3]] —— 10 月巡检生成的季度回忆录\n","mtime":1792108800000},{"path":"A-Projects/实习求职.md","text":"---\ntype: project\ngoal: \"[[职业发展]]\"\nstatus: active\ncreated: 2026-07-15\nupdated: 2026-10-08\n---\n## 项目描述\n找一份数据分析方向的实习，最好能接触交通或出行数据；每周到岗不超过三天，不耽误论文。\n\n## 下一步\n- [ ] 签好实习协议寄回 B 公司 📅 2026-10-20\n- [ ] 入职前把 SQL 窗口函数再练一遍\n- [ ] 入职 📅 2026-11-02\n\n## 进展日志\n### 2026-10-08\n跟周老师说了实习安排。周老师同意**每周到岗三天**，前提是 10 月 25 日的第三章初稿照常交。\n\n### 2026-09-28\n**决定去 B 公司**。下午回了 B 公司的邮件，也给 A 公司 HR 回了婉拒。最后起作用的只有两条：能接触真实的出行数据、能跟论文互相帮衬（见 [[能接触真实数据比离学校近更重要]]）。\n\n### 2026-09-26\nB 公司 HR 回复：**每周到岗三天可以**。\n\n### 2026-09-25\n晚上跟 AI 聊了一个小时怎么选（见 [[和 AI 讨论两个实习 offer 怎么选]]）。A 公司要求 **9 月 28 日前**答复。\n\n### 2026-09-24\n**B 公司 offer** 到了：做出行数据分析，通勤单程约一小时，日薪比 A 公司低一些。\n\n### 2026-09-22\n**A 公司 offer** 到了：做电商报表，离学校 20 分钟，日薪高一些。\n\n### 2026-09-10\nB 公司二面，被问 **SQL 窗口函数**，没答好，以为凉了。\n\n### 2026-08-28\n投了 12 家，回复 4 家，**A 公司笔试通过**。\n\n### 2026-07-15\n建档。师姐小钟建议把简历上的课程项目写具体，改了一版简历（课程项目见 [[课程项目-信号灯配时优化]]）。\n\n## 关联链接\n**goal**：[[职业发展]]\n- [[两个 offer 都来了反而更慌]] —— 两个 offer 到齐那晚的情绪记录\n- [[和 AI 讨论两个实习 offer 怎么选]] —— 做决定前的讨论\n- [[能接触真实数据比离学校近更重要]] —— 做决定那天的想法\n- [[两个选项都不差时给决定设截止日期]] —— 从这次讨论整理出的策略\n- [[毕业论文]] —— 实习时间要和论文进度协调\n","mtime":1792108800000},{"path":"A-Projects/日常事务.md","text":"---\ntype: project\ngoal: \"[[生活与体验]]\"\nstatus: active\ncreated: 2026-07-01\nupdated: 2026-10-09\n---\n## 项目描述\n没有归属的私事杂项都记在这里：宿舍、缴费、寄东西、买东西。\n\n## 下一步\n- [ ] 交宿舍电费 📅 2026-10-20\n- [ ] 让妈妈把冬天的厚外套寄过来\n- [ ] 给妈妈挑生日礼物 📅 2026-11-03\n- [ ] 值日表打印一份贴在门后\n\n## 进展日志\n### 2026-10-09\n和阿凯排了**宿舍值日表**，倒垃圾按单双周轮。值日表是阿凯提的，他说“自己选的就不算被安排”。\n\n### 2026-09-03\n宿舍台灯坏了，**换了新台灯**。\n\n### 2026-07-02\n整理了**证件和材料**放在哪，记在 [[证件与材料放在哪]]。\n\n### 2026-07-01\n建档。\n\n## 关联链接\n**goal**：[[生活与体验]]\n- [[阿凯在意的是被安排不是倒垃圾]] —— 值日表的前因\n- [[证件与材料放在哪]] —— 证件存放位置\n","mtime":1792108800000},{"path":"A-Projects/毕业论文.md","text":"---\ntype: project\ngoal: \"[[学业]]\"\nstatus: active\ncreated: 2026-07-01\nupdated: 2026-10-12\n---\n## 项目描述\n硕士毕业论文，题目暂定“基于深度学习的城市道路短时交通流预测”。用课题组的路段检测器数据（5 分钟粒度），比较统计模型和深度学习模型在 15–60 分钟预测上的表现。导师周老师。\n\n## 下一步\n- [x] 跑通 LSTM 基线模型 📅 2026-09-30\n- [ ] 补上 GRU 对比实验（周老师 9 月 16 日组会要求）\n- [ ] 第三章初稿交周老师 📅 2026-10-25\n- [ ] 中期检查材料提交 📅 2026-11-15\n- [ ] 第四章对比实验全部跑完 📅 2026-12-20\n- [ ] 补读 3 篇图神经网络做交通预测的综述\n\n## 进展日志\n### 2026-10-12\n第三章写到 **3.3 节**。图的配色还没统一，先往后放。\n\n### 2026-09-27\n**LSTM 基线跑通**。15 分钟预测的误差比历史均值法低了不少，具体数还要再核一遍。\n\n### 2026-09-16\n组会汇报第三章框架。周老师追问为什么基线只有历史均值和 ARIMA，要求补 **GRU** 对比（见 [[组会被周老师追问基线模型]]）。\n\n### 2026-09-08\n**第三章开工**。从“LSTM 输入怎么构造”这一小段写起，一口气写了两个小时（见 [[开工的门槛是任务大小不是意志力]]）。\n\n### 2026-08-26\n组会汇报数据清洗结果，用了写三句话的办法（见 [[三句话写出来以后 PPT 只是配图]]）。\n\n### 2026-08-18\n**数据清洗完成**。拆成 6 个 25 分钟的小块做的，前后两天（见 [[数据清洗拆成小块两天就做完了]]）。\n\n### 2026-07-22\n组会汇报暑假计划。周老师只问了数据来源。\n\n### 2026-07-08\n计划写文献综述，一下午**一个字没写**（见 [[对着空白的文献综述坐了一下午]]）。\n\n### 2026-07-01\n建档。6 月已开题。暑假目标：数据清洗 + 文献综述初稿。\n\n## 关联链接\n**goal**：[[学业]]\n- [[把论文拆到 25 分钟能开工的大小]] —— 开工卡住时用的策略\n- [[组会前先写三句话结论]] —— 组会前用的策略\n- [[课程项目-信号灯配时优化]] —— 上学期课程项目的数据处理脚本沿用到了这里\n- [[实习求职]] —— 实习每周到岗三天，要和论文进度协调\n- [[提示词怎么写得更具体]] —— 请 AI 帮写数据清洗代码时用的写法\n","mtime":1792108800000},{"path":"A-Projects/跑步计划.md","text":"---\ntype: project\ngoal: \"[[身体健康]]\"\nstatus: active\ncreated: 2026-08-03\nupdated: 2026-10-11\n---\n## 项目描述\n8 月开始跑步。目标：年底前能不停跑完 10 公里；每周跑 3 次，早上 7 点在学校操场。\n\n## 下一步\n- [ ] 报名学校秋季 10 公里校园跑 📅 2026-10-20\n- [ ] 跑完 10 公里校园跑 📅 2026-11-08\n- [ ] 换一双缓震好一点的跑鞋\n\n## 进展日志\n### 2026-10-11\n慢跑 **6 公里**，全程尽量压在二区，配速 7 分 40 秒左右。\n\n### 2026-09-20\n第一次跑 **7 公里**。回看 8 月 30 日那次的心率，其实一直在三区（见 [[跑步入门的心率区间]] 的 9 月 20 日补充）。\n\n### 2026-08-30\n**第一次不停跑完 5 公里**，36 分钟（见 [[第一次不停跑完五公里]]）。\n\n### 2026-08-12\n开始按**二区心率**慢跑，慢得像快走。\n\n### 2026-08-05\n读完《原子习惯》，开始前一晚把**跑鞋放门口**。\n\n### 2026-08-03\n第一次跑。跑一圈走一圈，一共 3 公里，喘得不行。\n\n## 关联链接\n**goal**：[[身体健康]]\n- [[跑步入门]] —— 跑步相关知识的总领\n- [[跑步入门的心率区间]] —— 训练强度按这里定\n- [[《原子习惯》读书笔记]] —— 前一晚放鞋、习惯叠加的出处\n- [[第一次不停跑完五公里]] —— 第一个里程碑\n","mtime":1792108800000},{"path":"AGENTS.md","text":"# 个人数据库 · AI 执行规则\n\n> 本库记录并蒸馏用户的经历，为用户打造专属的 AI 上下文。\n> 本文件是库的说明书，也是**唯一真相**：有什么、放在哪、长什么样、什么不许做。做事的步骤写在 skill 里（第三节）。变更记在 [[个人数据库]] 进展日志。设计意图见仓库的 `docs/`。\n> 这是模板：第零节的对话原则、第七节的 goal / situation / field 取值都是示例，按你自己的改。\n\n## 零、对话原则\n\n1. 回答客观，不为照顾用户情绪隐瞒信息与结论。\n2. 先总结，再细节，最后逐条列需要用户决定的点。\n\n## 一、铁律\n\n0. **本文件优先**：操作本库一律按本文件；用户明确要求破例时照做，做完问要不要写进规则。\n1. **原话逐字保留**：B 层原始记录与 A 层进展日志只增不改，不改写、不美化、不摘要；AI 只可移动、加 frontmatter、加或修链接、调排版。\n2. **只归档不删**：结束的项目、旅行移入 A-Archive（6.1）。确需清掉的（处理完的 Unclear、确认过的纯空壳）移进 `.trash/`，不真删。\n3. **不明就放 Unclear**：类型不明、信息不足、意图多义、需要确认、词表外的新类别，放 `0-Unclear/`，不猜。\n4. **文件名由 AI 从内容提炼**。\n5. **frontmatter 不编造**：没提到的留空。\n6. **判断不落盘**：看板只列事实；好坏对错、今天该干什么只在对话里说。C 层可写 AI 对用户的推测，但须标「（AI 判断）」并附证据（4.1）。\n7. **用户定规则，AI 管内容**：归类、蒸馏、维护是 AI 的活；本文件只在用户要求时改。\n8. **移动、改名不断链**：改名或移动后，把全库指向它的链接（`[[旧名]]`、带路径的 `[[旧路径/…]]`）一并改掉，再查一遍没有断链。\n\n## 二、目录结构\n\n```\n0-Inbox/                 入口 · 用户想存的一切，AI 归位后清空\n0-Unclear/               入口 · AI 判断不了的，写成选择题等用户勾\n\nA-Projects/              执行 · 正在筹备和进行的事\nA-Holidays/              执行 · 旅行计划与想法\nA-Archive/               执行 · 已结束的事与旅行（只读）\n\nB-Emotions/              记录 · 情绪（事件 → 心理活动 → 感悟）\nB-Insights/              记录 · 想法与摘录，向内\nB-Topics/\u003c大类>/          记录 · 主题学习与领域知识，向外\nB-Dialogues/             记录 · 和 AI 关于某件事的讨论\nB-Tools/\u003c大类>/\u003c项目>/    记录 · 用户做的产品\nB-Info/                  记录 · 个人资料索引（不存隐私原文）\nB-Meals/                 记录 · 每日饮食营养（AI 由照片估算，不存照片）\n\nC-Playbook/\n  ├ C-Strategies/        蒸馏 · 应对策略\n  └ C-Situations/        蒸馏 · 情境综述\nC-Knowledge/             蒸馏 · 知识体系\nC-Memoirs/               蒸馏 · 季度回忆录\nC-WhoRU.md               蒸馏 · 用户侧写：画像（月更）+ 近况（日更）\n\nCLAUDE.md                本文件\nAGENTS.md                本文件的原样副本（供 Codex 等读 AGENTS.md 的工具），勿单独改\n.claude/skills/          做事的步骤：入库、巡检\n```\n\nA 执行（有状态、会结束）· B 记录（第一手素材）· C 蒸馏（AI 合成，可重跑）。\n\n## 三、做事\n\n用户每说一句话，先看它是哪一种，可以同时是几种：\n\n| 它是 | 怎么做 |\n|---|---|\n| 提问（「我最近……？」「上次……怎么处理的？」） | 按 3.2 查库作答，不入库 |\n| 交代一件事（写邮件、改简历、分析数据） | 去做；做的过程中冒出的决定、进展、感受照样入库 |\n| 说出以后还用得上的事：事实、进展、决定、感受、想法，或发来照片、说「记一下」「整理收件箱」 | 按 `.claude/skills/vault-filing/SKILL.md` 入库 |\n| 每周巡检，或说「巡检」「蒸馏一下」 | 按 `.claude/skills/vault-inspection/SKILL.md` |\n\n能自动加载 skill 的工具会自己读；不能的，直接读上面的文件。\n\n**skill 没写到的事**：按铁律和本文件自己判断，去做。能撤回的直接做，做完说明；撤不回的（删除、改本文件、对外发送）先问用户。同一类事第三次出现，提议写成 skill。\n\n### 3.1 不入库\n- 项目工作文档（PPT 稿、方案稿等）。\n- 只服务当前工作的安排（如近期优先级），留在对话里。\n- 噪音、临时信息：丢掉，在回复里说丢了什么。\n\n### 3.2 查询\n1. 了解用户本人，先读 `C-WhoRU.md`，再顺链接深挖；它只是索引，引用事实以原记录为准。\n2. 按 frontmatter（type / situation / emotiontype / field / goal）和文件名筛选，只读命中的少数文件及其关联链接。\n3. 作答时说明查了哪些范围、可能漏了什么。\n\n### 3.3 蒸馏\n- 只在用户要求或巡检时做，不自动生成；新情境类别、新 knowledge 体系先提议。\n- 必须带 **证据** / **反例** 反链，结论前置，可随时重跑。\n\n## 四、通用格式\n\n- frontmatter 只放分类轴（这是什么），`---` 在第一行；关系写在正文 `## 关联链接`（牵连谁 + 为什么）。\n- 正文从 `##` 开始，最深 `####`，每篇最多一个 `#`；分节用标题，不用 `**加粗标签**：`（`## 关联链接` 里的栏名除外）。一篇只讲一个主题。\n- 日期 `YYYY-MM-DD`；数组行内写 `[a, b]`；列表用 `-`，子级缩进 2 空格；段落间空一行。\n- 中英文、中文与数字之间加空格；中文用全角标点；粗体只给关键词或结论；代码块声明语言；图片用 `![[图片名.png]]`。\n- `## 关联链接` 写法：\n\n```markdown\n## 关联链接\n**goal**：[[学业]]\n**证据**：\n- [[某emotion记录]] —— 一句话说明为什么关联\n**来源**：《原子习惯》\n```\n\n### 4.1 原话与 AI 判断分开（C 层全部文件）\n- **用户原话**放「」，紧跟出处：`「能查的先查完，剩下的交给时间」（[[实习求职]] 2026-09-28）`。逐字，不拼接。\n- **记录里的事实**带出处链接，不标注。\n- **AI 的推测**（动机、模式、原因、没说出口的感受）句末标「（AI 判断）」；整节都是推测时，节首写一次 `（本节为 AI 判断，依据见证据栏）`。拿不准的按推测标。\n- **书、理论、播客**写进 **来源** / **理论依据**，不标。\n- 规则生效前写的 C 文件，下次修改时补标，不集中回填。\n\n## 五、类型速查表\n\n| type | 目录 | frontmatter（type 之外） | 正文结构 |\n|---|---|---|---|\n| `project` | A-Projects → A-Archive | goal, status, created, updated | 项目描述 → 下一步 → 进展日志 → 关联链接 |\n| `holiday` | A-Holidays → A-Archive | status, start, created, updated | 自由 → 关联链接 |\n| `emotion` | B-Emotions | created, situation, emotiontype | 客观事件 → 心理活动 → 感悟（可空）→ 这件事我跟谁说了（可空）→ 关联链接 |\n| `insight` | B-Insights | created, situation | 内容（原文逐字）→ 关联链接 |\n| `topic` | B-Topics/\u003c大类> | created, updated, field | 自由 → 关联链接 |\n| `dialogue` | B-Dialogues | created, updated | 自由 → 关联链接 |\n| `readme` / `changelog` | B-Tools/\u003c大类>/\u003c项目> | created, updated | 功能描述 + 各节 → 关联链接 |\n| `info` | B-Info | created, updated | 自由 |\n| `meal` | B-Meals | created, updated | 各餐 → 当日合计 → 关联链接（6.12） |\n| `strategy` | C-Strategies | created, updated, situation | 证据等级区 → Principle → 识别信号 → 机制 → 破解步骤 → 关联链接 |\n| `situation` | C-Situations | created, updated | 定义 → 洞见综述 → Insights → Strategies |\n| `knowledge` | C-Knowledge | created, updated, field | 总领 → 知识地图 → 关系 → 缺口 → 关联链接 |\n| `memoir` | C-Memoirs | period, created, updated | 季度综述 → 时间线 |\n| `unclear` | 0-Unclear | created | 见 6.7 |\n| `profile` | 库根目录 `C-WhoRU.md` | created, updated | 画像 → 近况 → 关联链接（6.11） |\n\n- emotion、insight 写完即冻结，只有 created。\n- topic、tool、info、knowledge 不设 status；没做完的事由 project 追踪。\n\n## 六、补充规则\n\n### 6.1 project\n- 进展日志每条一个 `### YYYY-MM-DD`，倒序，关键词加粗，保留弯路。\n- 小事写成 `下一步` 里的 `- [ ]`，硬 deadline 加 📅；无归属的杂事进 [[日常事务]]。\n- `status: done`（含中途终止，日志注明）后移入 A-Archive，原文不改。\n\n### 6.2 holiday\n- 状态同 project：planned（想法 / 筹备）→ active（已订 / 出行中）→ done。\n- 旅途感受记 emotion，行程讨论记 dialogue，都链回本行程。\n\n### 6.3 dialogue\n- 关联的 project、holiday、insight 写进关联链接，不强制分流。\n- 需要时加一行 `**性质**：与 AI 深谈整理，含推测成分`。\n\n### 6.4 tool\n- 一个项目一个文件夹：`README.md`（怎么用、为什么这样设计）+ `CHANGELOG-vN.md`（决策、踩坑、进度）；接力文档、工作日志的 type 取两者中更贴的一个。旧文件不追溯改名。\n- 链接 tool 项目指向它的 README：`[[B-Tools/\u003c大类>/\u003c项目>/README|\u003c项目>]]`。\n\n### 6.5 memoir\n- 一季一份，巡检时生成，写法见巡检 skill。\n\n### 6.6 knowledge\n- 一份文件 = 一个知识体系；单个知识点写在 B-Topics。写法见巡检 skill。\n\n### 6.7 unclear 模板\n```markdown\n## 原始记录\n（用户原话逐字）\n\n## 判断选项\n（1–2 句：为什么不明 + AI 最佳猜测）\n- [ ] **A**（推荐）：具体处置一句话\n- [ ] **B**：备选\n- [ ] **C**：其他 / 我自己写\n\n## 关联链接\n```\n用户勾选后，AI 照选项处理，再把这份 Unclear 移进 `.trash/`。\n\n### 6.8 info\n- 只记「有什么、在哪」，不写证件号、密码等原文；不参与蒸馏。\n\n### 6.9 看板\n- 只有网页版 [[B-Tools/Obsidian/Cockpit-Web/README|Cockpit-Web]]（仓库里的 `cockpit-web/index.html`）：浏览器读库，只读，只放机械统计，不写判断。\n\n### 6.10 strategy 证据等级\n- **等级区**：frontmatter 下第一段，三行引用块：\n  ```\n  > 🟡 部分验证 · 出现 3 次 · 执行 2 次（有效 1 / 无效 0 / 未记录 1）· 更新 2026-10-16\n  > 出现：[[记录A]]（2026-07-21）· [[记录B]]（2026-08-04）· [[记录C]]（2026-09-30）\n  > 执行：[[记录D]]（2026-09-18，有效）· [[记录E]]（2026-09-28，未记录）\n  ```\n  某栏没有就写「无」；多步策略有一步从没做过，第一行末尾加「· 缺第 N 步」；说明另起一段。\n- **四档**只看照做后的结果，出现次数不抬高等级：\n  - 🔴 存疑：无效（含反例）≥ 1，且无效 ≥ 有效\n  - ⚪ 待验证：有效 0 次\n  - 🟡 部分验证：有效 1–2 次\n  - 🟢 已验证：有效 ≥ 3 次；有「缺第 N 步」的最高到 🟡\n- 怎么计数、什么时候重算：见巡检 skill。\n- 存疑的策略不删，由用户决定改写还是归档。\n\n### 6.11 profile（`C-WhoRU.md`）\n- 作用：任何 AI 一打开就知道用户是什么样的人、在忙什么、要注意什么。\n- `## 画像`：目标、长处短板、常见模式、和他打交道要注意的。每月第一次巡检整节重写，≤ 30 行。\n- `## 近况`：在做什么、最近状态、这几天要注意的。每天由定时任务（如 08:00 的早间简报）整节重写，只改这一节，≤ 15 行。\n- 两节第一行都写 `更新 YYYY-MM-DD`；每条带出处和日期，原话放「」，推测标「（AI 判断）」。\n- 情绪只写一行概括 + 链接，不抄原文；不写只服务当前工作的安排和隐私原文。\n- 其他 C 文件不得拿它当证据，要引用就引用它链接的原记录。\n- 「这几天要注意」每天整份重写、不会过期，不违反铁律 6；只写记录能支持的提醒，不替用户定计划。\n\n### 6.12 meal（饮食）\n- 一天一个文件 `B-Meals/YYYY-MM-DD.md`；同一天再有一餐就追加，改 `updated`。\n- 用户发来照片，AI 认出食物、估算份量和营养，只记数据，不存照片；用户给的准确数据（营养标签、称重）照抄并注明。\n- 每餐一节（`## 早餐` / `## 午餐` / `## 晚餐` / `## 加餐`），一张表：\n\n  | 食物 | 份量 (g) | 热量 (kcal) | 蛋白质 (g) | 脂肪 (g) | 碳水 (g) |\n  |---|---|---|---|---|---|\n\n  表下写 `（AI 估算，依据照片）`；认不准的照样写，后面标「（不确定）」。\n- `## 当日合计` 把各列加总；「吃多了」这类判断只在对话里说。\n- `## 关联链接` 写 `**goal**：[[身体健康]]`。\n\n## 七、字段取值表\n\n| 字段 | 用于 | 写法 | 取值 |\n|---|---|---|---|\n| `type` | 全部 | 单值 | project · holiday · emotion · insight · topic · dialogue · readme · changelog · info · strategy · situation · knowledge · memoir · unclear · profile · meal |\n| `status` | project、holiday | 单值 | planned · active · done |\n| `created` | 全部 | `YYYY-MM-DD` | 建档日期 |\n| `updated` | 除 emotion、insight、unclear 外全部 | `YYYY-MM-DD` | 最近一次实质修改的日期 |\n| `start` | holiday | `YYYY-MM-DD` | 出发日期，未定留空 |\n| `period` | memoir | `YYYY-QN` | 如 `2026-Q3` |\n| `goal` | project | 单值 wikilink：`\"[[学业]]\"` | [[学业]] · [[职业发展]] · [[身体健康]] · [[生活与体验]] · [[终身学习]] |\n| `situation` | emotion、insight、strategy | wikilink 数组：`[\"[[决策]]\", \"[[压力]]\"]` | 启动-执行 · 压力 · 决策 · 人际关系 · 自我价值与意义感 · 规划 |\n| `emotiontype` | emotion | wikilink 数组：`[\"[[fear]]\", \"[[sadness]]\"]` | anger · disgust · fear · joy · peace · poignant · sadness · shame · surprise |\n| `field` | topic（只放一个）、knowledge（可多个） | wikilink 数组：`[\"[[AI]]\"]` | AI · 身心 · 金融 · 科研方法 · 阅读 · 工具 |\n\n- **只用表中取值**；要新增，放 `0-Unclear/` 或向用户提议。goal、situation、field 由用户增删。\n- **situation** 对应 C-Situations 下的实体文件；**emotiontype** 由 AI 按记录推断；**goal、emotiontype、field** 和 **来源** 栏的链接都是虚拟概念，不新建文件。\n- 非 project 属于某 goal 时，写在 `## 关联链接`：`**goal**：[[某goal]]`；涉及身体健康的一律挂 [[身体健康]]。\n- **field** 等于 B-Topics 的大类目录名；topic 的 field 必须等于所在目录，移动时同步改。\n","mtime":1792108800000},{"path":"B-Dialogues/和 AI 讨论两个实习 offer 怎么选.md","text":"---\ntype: dialogue\ncreated: 2026-09-25\nupdated: 2026-09-26\n---\n**性质**：与 AI 深谈整理，含推测成分\n\n## 背景\n9 月 22 日、24 日先后收到 A 公司、B 公司的数据分析实习 offer，A 公司要求 9 月 28 日前答复。9 月 25 日晚上和 AI 聊了大约一个小时，下面是整理。\n\n## 讨论过程\n- 我把两页优缺点原文贴给 AI。AI 让我对每一条问一句“入职三个月后我还会在意吗”，十几条筛完剩四条：日薪、通勤、做的数据和论文有没有关系、有没有人带。\n- AI 问：如果两家钱一样、通勤一样，选哪个？我几乎没想就说 B。AI 说，那剩下要判断的只是“钱和通勤上的差距，值不值得换掉 B 的那部分”。\n- 我说怕通勤一小时拖累论文。AI 建议先问 B 公司能不能每周只到岗三天，再算通勤账。\n- AI 推测我列这么多条，可能是在推迟做决定，而不是缺信息。我说：其实我心里早就偏 B 了，列那么多条是想找一个能说服自己选 A 的理由。\n- AI 提到，这次 A 公司定了 9 月 28 日的期限，等于有人替我定了截止日期；以后遇到两个选项都不差、又没人催的情况，可以自己先定一个日子，到期就按当时的信息选。它说《决断力》里有类似的说法。\n\n## 当晚的结论\n先问 B 公司到岗天数，周末想清楚，28 日前回复。\n\n## 2026-09-26 补充\n- B 公司 HR 回复：每周到岗三天可以。\n- 请 AI 把“自己给决定设截止日期”整理成了一条策略：[[两个选项都不差时给决定设截止日期]]。这条来自 AI 的建议，我自己还没试过。\n\n## 关联链接\n**goal**：[[职业发展]]\n- [[实习求职]] —— 讨论的就是这件事，9 月 28 日决定去 B 公司\n- [[两个 offer 都来了反而更慌]] —— 前一天晚上的情绪记录\n- [[两个选项都不差时给决定设截止日期]] —— 从这次讨论整理出的策略\n- [[提示词怎么写得更具体]] —— 这次把清单原文贴给 AI，比只问“选哪个”有用\n","mtime":1792108800000},{"path":"B-Emotions/两个 offer 都来了反而更慌.md","text":"---\ntype: emotion\ncreated: 2026-09-24\nsituation: [\"[[决策]]\"]\nemotiontype: [\"[[joy]]\", \"[[fear]]\"]\n---\n## 客观事件\n9 月 22 日收到 A 公司数据分析实习 offer，要求 9 月 28 日前答复。9 月 24 日收到 B 公司 offer。A 公司：离学校 20 分钟，日薪高一些，做电商报表。B 公司：通勤单程约一小时，日薪低一些，做出行数据分析。当晚列了两页优缺点，到 23:00。\n\n## 心理活动\n投了两个月，一下来俩，本来应该很开心的。结果今晚列优缺点列到十一点，越列越乱。A 离得近、钱多，B 跟我论文更搭。我怕选了 A 以后后悔没学到东西，又怕选了 B 天天通勤累死，还耽误论文。只剩四天了。\n\n## 感悟\n两个都想要的时候，就会两个都怕。\n\n## 关联链接\n**goal**：[[职业发展]]\n- [[实习求职]] —— 两个 offer 的详情\n- [[和 AI 讨论两个实习 offer 怎么选]] —— 第二天晚上和 AI 聊了这件事\n","mtime":1792108800000},{"path":"B-Emotions/先说需求反而让阿凯更不高兴.md","text":"---\ntype: emotion\ncreated: 2026-09-20\nsituation: [\"[[人际关系]]\"]\nemotiontype: [\"[[anger]]\", \"[[sadness]]\"]\n---\n## 客观事件\n2026-09-20（周日）宿舍垃圾桶满了两天。对阿凯说：“我需要宿舍干净一点，这周垃圾都是我倒的。”阿凯回：“你直接说让我倒垃圾不就行了，搞得像开会。”随后拿着垃圾出了门。当晚两人没再说话。\n\n## 心理活动\n我明明是照上次那个办法说的，先说需求再说事实，怎么这次就炸了。他那句“搞得像开会”特别扎，好像我在装。可我也委屈啊，垃圾确实都是我倒的。现在俩人各戴各的耳机，宿舍安静得吓人，比吵一架还难受。\n\n## 感悟\n\n## 关联链接\n**goal**：[[生活与体验]]\n- [[室友摩擦先说需求再说事实]] —— 照着做了，结果更糟\n- [[阿凯在意的是被安排不是倒垃圾]] —— 三天后的后续\n","mtime":1792108800000},{"path":"B-Emotions/国庆回家妈妈跟亲戚夸我.md","text":"---\ntype: emotion\ncreated: 2026-10-03\nsituation: [\"[[自我价值与意义感]]\"]\nemotiontype: [\"[[poignant]]\", \"[[joy]]\"]\n---\n## 客观事件\n2026-10-03 国庆在家，亲戚来家里吃饭。饭桌上妈妈跟亲戚说，儿子在读研究生，用人工智能预测堵车，还找到了实习。饭后洗碗时，妈妈问实习远不远、累不累，说：“你自己选的就行，我们也不懂。”\n\n## 心理活动\n听我妈那么讲我有点想钻桌子底下，什么人工智能预测堵车，我第三章还没写完呢。但她说的时候眼睛亮亮的，我又说不出“没那么厉害”。洗碗的时候她站在旁边一直问通勤要多久，我说一个小时，她说那早饭得吃好。突然有点鼻酸。\n\n## 感悟\n她不懂我在做什么，但一直知道我累不累。\n\n## 关联链接\n**goal**：[[生活与体验]]\n- [[实习求职]] —— 妈妈问的就是这份实习\n- [[寒假去海边]] —— 那天也聊到了寒假一起出去\n","mtime":1792108800000},{"path":"B-Emotions/对着空白的文献综述坐了一下午.md","text":"---\ntype: emotion\ncreated: 2026-07-08\nsituation: [\"[[启动-执行]]\"]\nemotiontype: [\"[[shame]]\", \"[[fear]]\"]\n---\n## 客观事件\n2026-07-08 下午计划写毕业论文第二章文献综述。14:00 到 18:00 在实验室，文档里只写了标题“2 相关研究”。期间刷手机，整理了文献管理软件里的文件夹。\n\n## 心理活动\n又是这样。打开文档就发呆，脑子里一团乱：先写统计方法还是先写深度学习？要不要先把那五十篇文献再过一遍？越想越不敢下手，就去整理文件夹，好像在干活其实啥也没干。到六点的时候特别烦自己，都研二了还这样。晚饭也没什么胃口。\n\n## 感悟\n可能是“写综述”这个任务太大了，我根本不知道第一步是什么。\n\n## 关联链接\n**goal**：[[学业]]\n- [[毕业论文]] —— 第二章文献综述\n- [[把论文拆到 25 分钟能开工的大小]] —— 这次是这条策略的证据之一\n","mtime":1792108800000},{"path":"B-Emotions/第一次不停跑完五公里.md","text":"---\ntype: emotion\ncreated: 2026-08-30\nsituation: [\"[[自我价值与意义感]]\"]\nemotiontype: [\"[[joy]]\", \"[[surprise]]\"]\n---\n## 客观事件\n2026-08-30 早上 7 点在学校操场，第一次中途不走、跑完 5 公里，用时 36 分钟，手表显示平均心率 152。距离第一次跑步（8 月 3 日，跑一圈走一圈，共 3 公里）27 天。\n\n## 心理活动\n跑到第四公里腿特别沉，心里一直数圈，想着再跑一圈就停，结果一圈一圈就跑完了。停下来看表的时候有点不敢相信，四个礼拜前我跑一公里就喘得不行。拍了张表盘发给我妈，她回了一串大拇指。\n\n## 感悟\n跑完的开心跟论文被夸不一样：它不用等谁来评价，表上的数就在那。\n\n## 关联链接\n**goal**：[[身体健康]]\n- [[跑步计划]] —— 第一个里程碑\n- [[跑步入门的心率区间]] —— 这次平均心率其实在三区，9 月 20 日回看时发现\n","mtime":1792108800000},{"path":"B-Emotions/组会前一晚改 PPT 改到一点.md","text":"---\ntype: emotion\ncreated: 2026-07-22\nsituation: [\"[[压力]]\"]\nemotiontype: [\"[[fear]]\"]\n---\n## 客观事件\n2026-07-22 上午组会轮到汇报。前一晚 21:00 开始改 PPT，改到凌晨 1 点，主要在改字体和配色。师姐小钟发消息说：先别改 PPT 了，用三句话写下这周干了啥、结果怎么样、卡在哪。照做后十分钟写完三句话，1 点半睡下。组会上周老师只问了一个数据来源的问题。\n\n## 心理活动\n这周其实就干了一点点，数据还没洗完，总觉得周老师会问“你这周都干嘛了”。PPT 改来改去就是换字体换颜色，越改越慌。师姐说写三句话的时候我还想这有啥用，结果写完发现，我这周干的事其实说得清楚，就是不多而已。好像没那么怕了。\n\n## 感悟\n怕的不是周老师，是自己说不清楚。\n\n## 关联链接\n**goal**：[[学业]]\n- [[毕业论文]] —— 这次组会汇报暑假计划\n- [[组会前先写三句话结论]] —— 师姐教的办法，后来整理成了这条策略\n","mtime":1792108800000},{"path":"B-Emotions/组会被周老师追问基线模型.md","text":"---\ntype: emotion\ncreated: 2026-09-16\nsituation: [\"[[压力]]\"]\nemotiontype: [\"[[fear]]\", \"[[shame]]\"]\n---\n## 客观事件\n2026-09-16 组会汇报第三章框架，会前花十分钟写了三句话结论。汇报中周老师连续追问：为什么基线只选历史均值和 ARIMA，为什么不比 GRU。当场回答“打算后面补”，周老师要求下次组会前补上 GRU 对比。会后没有复盘。写这条记录时快十二点，还没睡着。\n\n## 心理活动\n被问住的那一下脸一下就热了，感觉全组都在看我。还好三句话是提前写好的，被打断以后我还能回到“第三章目前的结论是……”那句接着讲，没乱。但现在躺在床上一直在脑子里重放，要是当时这么说就好了、那么说就好了，快十二点了还睡不着。\n\n## 感悟\n三句话救了现场，但救不了晚上。\n\n## 关联链接\n**goal**：[[学业]]\n- [[毕业论文]] —— 组会后加了 GRU 对比实验\n- [[组会前先写三句话结论]] —— 第 1 步做了，第 2 步没做\n","mtime":1792108800000},{"path":"B-Emotions/跟阿凯说了想十二点以后安静点.md","text":"---\ntype: emotion\ncreated: 2026-08-07\nsituation: [\"[[人际关系]]\"]\nemotiontype: [\"[[anger]]\", \"[[peace]]\"]\n---\n## 客观事件\n8 月 4 日到 6 日，室友阿凯连续三晚打游戏到凌晨一两点，开着外放语音。8 月 7 日晚上，主动跟阿凯说：“我最近早上七点要起来跑步，想请你十二点以后戴耳机。”然后说了前几天几点被吵醒。阿凯说没注意到，当晚就戴上了耳机。\n\n## 心理活动\n前两天真的气死了，躺床上听他喊“上啊上啊”，想直接吼一句。但又觉得为这点事吵起来，以后天天见面多尴尬。今天憋了半天，想起之前看过的说法，先说我要啥，再说他干了啥。说出口比想象中容易，他居然还说了句不好意思。早知道早点说。\n\n## 感悟\n先说我要什么，他就不用猜我是不是在指责他。\n\n## 关联链接\n**goal**：[[生活与体验]]\n- [[室友摩擦先说需求再说事实]] —— 第一次这样说，有用\n- [[跑步计划]] —— 早起跑步是这次开口的理由\n","mtime":1792108800000},{"path":"B-Info/证件与材料放在哪.md","text":"---\ntype: info\ncreated: 2026-07-02\nupdated: 2026-09-24\n---\n## 证件\n- 身份证：宿舍书桌左边抽屉，蓝色透明文件袋\n- 学生证、校园卡：钱包\n- 本科毕业证、学位证原件：家里，妈妈收在衣柜上层的文件盒\n\n## 电子材料\n- 证件扫描件：网盘“证件”文件夹\n- 最新简历：网盘“求职”文件夹，2026 年 9 月版\n- 实习 offer 邮件：邮箱里的“实习”标签\n\n## 纸质材料\n- 盖章成绩单：和身份证放在同一个文件袋\n","mtime":1792108800000},{"path":"B-Insights/三句话写出来以后 PPT 只是配图.md","text":"---\ntype: insight\ncreated: 2026-08-26\nsituation: [\"[[压力]]\"]\n---\n## 内容\n今天组会前只花十分钟写了三句话：这两周做了什么，结果怎么样，卡在哪。讲的时候心里有底，周老师问到缺失值怎么处理，我也接得住。PPT 其实就是给这三句话配图，之前花一晚上改字体，真的是在逃避。\n\n## 关联链接\n**goal**：[[学业]]\n- [[组会前先写三句话结论]] —— 第二次照着做\n- [[组会前一晚改 PPT 改到一点]] —— 第一次用这个办法的那晚\n","mtime":1792108800000},{"path":"B-Insights/开工的门槛是任务大小不是意志力.md","text":"---\ntype: insight\ncreated: 2026-09-08\nsituation: [\"[[启动-执行]]\"]\n---\n## 内容\n“写第三章”根本开不了工，“写 LSTM 输入怎么构造这一段”就可以。开工的门槛是任务大小，不是我意志力差。今天定了 25 分钟，时间到了我已经停不下来，一口气写了两个小时。\n\n## 关联链接\n**goal**：[[学业]]\n- [[毕业论文]] —— 第三章开工\n- [[把论文拆到 25 分钟能开工的大小]] —— 这条策略的证据之一\n","mtime":1792108800000},{"path":"B-Insights/数据清洗拆成小块两天就做完了.md","text":"---\ntype: insight\ncreated: 2026-08-18\nsituation: [\"[[启动-执行]]\"]\n---\n## 内容\n“数据清洗”在待办里挂了三周。前天把它拆成六块：缺失值统计、缺失值插补、异常值筛查、时间戳对齐、路段编号核对、存成训练格式，每块定 25 分钟。今天最后一块做完了，前后就两天。原来不是我不想做，是“数据清洗”这四个字没法下手。\n\n## 关联链接\n**goal**：[[学业]]\n- [[毕业论文]] —— 8 月 18 日数据清洗完成\n- [[把论文拆到 25 分钟能开工的大小]] —— 这条策略的证据之一\n","mtime":1792108800000},{"path":"B-Insights/能接触真实数据比离学校近更重要.md","text":"---\ntype: insight\ncreated: 2026-09-28\nsituation: [\"[[决策]]\"]\n---\n## 内容\n两页优缺点，最后真正起作用的只有两条：能不能接触真实的出行数据，能不能跟论文互相帮衬。通勤远一点、钱少一点，都扛得住。其他十几条都是在给自己找安全感。\n\n## 关联链接\n**goal**：[[职业发展]]\n- [[实习求职]] —— 这天决定去 B 公司\n- [[和 AI 讨论两个实习 offer 怎么选]] —— 筛掉那十几条是在这次讨论里做的\n","mtime":1792108800000},{"path":"B-Insights/阿凯在意的是被安排不是倒垃圾.md","text":"---\ntype: insight\ncreated: 2026-09-23\nsituation: [\"[[人际关系]]\"]\n---\n## 内容\n冷战第三天，我先去跟阿凯说：“那天我说话的方式让你不舒服了。”他说：“我也不是不想倒垃圾，就是烦被安排，搞得我像个下属。”原来他在意的是被安排，不是活儿本身。那句“我需要宿舍干净一点”，在他听来就是在安排他。\n\n## 关联链接\n**goal**：[[生活与体验]]\n- [[先说需求反而让阿凯更不高兴]] —— 三天前的那次冲突\n- [[日常事务]] —— 后来一起排了值日表\n","mtime":1792108800000},{"path":"B-Tools/Obsidian/Cockpit-Web/README.md","text":"---\ntype: readme\ncreated: 2026-09-05\nupdated: 2026-09-05\n---\n## 功能描述\n- 看板页面在仓库的 `cockpit-web/index.html`，不放在库里。\n- 用 Edge 或 Chrome 直接打开，选择本库的文件夹即可。\n- 只读：只读取库里的 Markdown 和 frontmatter，不改任何文件。\n- 只放机械统计：活项目、deadline、Inbox / Unclear 积压、策略证据等级、侧写更新日期、格式体检。\n\n## 关联链接\n- [[个人数据库]] —— 看板服务的就是这个库\n","mtime":1792108800000},{"path":"B-Topics/AI/提示词怎么写得更具体.md","text":"---\ntype: topic\ncreated: 2026-07-26\nupdated: 2026-09-25\nfield: [\"[[AI]]\"]\n---\n## 为什么要具体\n让 AI 帮忙写代码或改文字时，说得越含糊，它越只能按“最常见的情况”去猜，结果看着像样，放到自己的数据上却跑不通。\n\n## 我现在的写法\n1. **背景**：我是谁、在做什么，比如“交通工程研二，在做短时交通流预测”。\n2. **输入长什么样**：贴几行数据样例、列名和单位，不要只说“一个交通流数据表”。\n3. **要什么输出**：格式、长度、用什么库，比如“用 pandas，返回按 5 分钟对齐的表”。\n4. **限制条件**：不能做什么、要注意什么，比如“缺失值不要直接删，要标出来”。\n5. **先让它复述**：复杂任务先让 AI 用自己的话说一遍它理解的需求，对了再开始写。\n\n## 例子\n- 含糊：“帮我清洗一下数据。”\n- 具体：“下面是 10 行检测器数据（列：时间、路段编号、流量、速度）。请用 pandas 写一个函数：时间戳对齐到 5 分钟；连续缺失不超过 3 个点的用线性插值，超过的保留为空值，并输出缺失段列表。”\n\n## 2026-09-25 补充\n讨论选择类的问题时，把自己的原始材料（比如优缺点清单原文）直接贴给 AI，比只问“我该选哪个”有用得多。AI 会先帮我把条目筛一遍，而不是给一个泛泛的答案。\n\n## 关联链接\n**goal**：[[终身学习]]\n- [[毕业论文]] —— 数据清洗代码大多是这样请 AI 帮写的\n- [[和 AI 讨论两个实习 offer 怎么选]] —— 9 月 25 日补充那条的出处\n","mtime":1792108800000},{"path":"B-Topics/身心/跑步入门的心率区间.md","text":"---\ntype: topic\ncreated: 2026-08-12\nupdated: 2026-09-20\nfield: [\"[[身心]]\"]\n---\n## 最大心率怎么估\n- 常见粗算：最大心率 ≈ 220 − 年龄。我 24 岁，约 196。这个公式个体误差不小，可能差十几次每分钟。\n- 更准的办法是实测，或者看跑表积累的数据；入门阶段粗算够用。\n\n## 五个区间\n按最大心率的百分比，常见划分如下：\n\n| 区间 | 占最大心率 | 感觉 | 用途 |\n| --- | --- | --- | --- |\n| 一区 | 50–60% | 很轻松 | 热身、恢复 |\n| 二区 | 60–70% | 能完整说话 | 打有氧基础，入门主力 |\n| 三区 | 70–80% | 只能说短句 | 节奏跑 |\n| 四区 | 80–90% | 说话困难 | 提高乳酸阈 |\n| 五区 | 90–100% | 说不出话 | 冲刺、间歇 |\n\n另一种算法是储备心率法：用最大心率减去静息心率，再乘百分比、加回静息心率，算出来的数会比上表高一些。\n\n## 对我意味着什么\n- 按 196 估算，二区大约是 118–137。\n- 刚开始按二区跑会慢得像快走，配速 8 分多，资料里说这很正常。\n- 入门阶段大部分时间跑二区，每周最多一次稍快的跑。\n\n## 2026-09-20 补充\n- 手腕上的光电心率在刚起跑的几分钟容易不准，看整段的平均更靠谱。\n- 回看 8 月 30 日跑 5 公里那次，平均心率 152，其实在三区。感觉“能坚持”和“在二区”不是一回事。\n\n## 关联链接\n**goal**：[[身体健康]]\n- [[跑步计划]] —— 训练强度按这里的区间定\n- [[跑步入门]] —— 归入跑步入门知识体系\n- [[第一次不停跑完五公里]] —— 9 月 20 日补充里提到的那次\n","mtime":1792108800000},{"path":"B-Topics/阅读/《原子习惯》读书笔记.md","text":"---\ntype: topic\ncreated: 2026-08-05\nupdated: 2026-09-12\nfield: [\"[[阅读]]\"]\n---\n## 这本书讲什么\n8 月初读完。讲小习惯怎么靠环境和系统养成，而不是靠咬牙坚持。下面是我自己的话。\n\n## 记下来的几点\n- **习惯的循环**：提示 → 渴求 → 反应 → 奖励。想养成一个习惯，就在这四个环节上让它更容易发生；想戒掉一个，就反过来让它更难。\n- **让提示更明显**：想做的事，把它要用的东西放在看得见的地方。\n- **两分钟法则**：新习惯先缩成两分钟内能开始的版本，比如“跑步”先缩成“换上跑鞋出门”。\n- **习惯叠加**：把新习惯挂在已有的习惯后面，比如“刷完牙之后换跑鞋”。\n- **身份认同**：与其定“跑完 10 公里”的目标，不如先把自己当成“一个会跑步的人”。\n\n## 我怎么用的\n- 前一晚把跑鞋和衣服放在宿舍门口。\n- 早上刷完牙直接换鞋出门。\n- 论文也套了两分钟法则，只是我把它放宽成了 25 分钟。\n\n## 2026-09-12 补充\n坚持一个月后发现，最有用的是“前一晚放鞋”，最没用的是给自己设奖励，跑完的那点开心本身就够了。\n\n## 关联链接\n**goal**：[[终身学习]]\n- [[跑步计划]] —— 放鞋、习惯叠加用在了跑步上\n- [[把论文拆到 25 分钟能开工的大小]] —— 两分钟法则放宽后用在了论文上\n- [[跑步入门]] —— 归入跑步入门知识体系\n","mtime":1792108800000},{"path":"C-Knowledge/跑步入门.md","text":"---\ntype: knowledge\ncreated: 2026-09-01\nupdated: 2026-10-01\nfield: [\"[[身心]]\"]\n---\n## 总领\n跑步入门的主线是“先慢下来，再跑得久”：用心率区间控制强度，大部分时间跑在能完整说话的二区，让有氧能力慢慢长起来。能不能坚持，靠的主要不是意志力，而是把出门的门槛降低。“感觉能坚持”和“真的在二区”不是一回事，要看心率数据。目前的原料以入门训练和习惯为主，还没有伤病预防和比赛配速。\n\n## 知识地图\n- 强度控制\n  - [[跑步入门的心率区间]] —— 最大心率估算、五个区间、二区慢跑、手表心率的误差\n- 坚持与习惯\n  - [[《原子习惯》读书笔记]] —— 让提示更明显、两分钟法则、习惯叠加\n  - [[把论文拆到 25 分钟能开工的大小]] —— 同一个“降低开工门槛”的思路，用在论文上\n\n## 关系\n- [[跑步入门的心率区间]] → [[《原子习惯》读书笔记]]：依赖 —— 二区强度低、跑完不难受，“让习惯容易坚持”才有条件成立\n- [[《原子习惯》读书笔记]] → [[把论文拆到 25 分钟能开工的大小]]：因果 —— 两分钟法则放宽成 25 分钟，就是这条策略的来源之一\n- [[跑步入门的心率区间]] → [[把论文拆到 25 分钟能开工的大小]]：对比 —— 一个把强度降低，一个把任务变小，都是先降门槛、再求积累\n\n## 缺口\n- 还没实测过最大心率，二区上限 137 是公式估算，可能有偏差。\n- 原料里没有拉伸、跑后恢复和防伤的内容。\n- 心率资料说入门以二区为主，而 [[跑步计划]] 里 11 月要跑 10 公里校园跑；二区配速下完赛时间偏长，两者怎么平衡还没有答案。\n\n## 关联链接\n**goal**：[[身体健康]]\n**证据**：\n- [[跑步入门的心率区间]] —— 强度控制部分的主要原料\n- [[《原子习惯》读书笔记]] —— 坚持与习惯部分的主要原料\n- [[把论文拆到 25 分钟能开工的大小]] —— 同一思路在论文上的应用\n**相关**：\n- [[跑步计划]] —— 这些知识正在用的项目\n","mtime":1792108800000},{"path":"C-Memoirs/2026-Q3.md","text":"---\ntype: memoir\nperiod: 2026-Q3\ncreated: 2026-10-01\nupdated: 2026-10-01\n---\n## 季度综述\n这一季有三条主线。论文：7 月对着空白文档一下午没开工，8 月把数据清洗拆小后两天做完，9 月第三章开工、LSTM 基线跑通。实习：7 月中旬开始准备，9 月同一周拿到 A 公司和 B 公司两个 offer，9 月 28 日选定 B 公司。跑步：8 月 3 日第一次跑，8 月 30 日第一次不停跑完 5 公里。另外，宿舍里和阿凯有两次摩擦，一次说开了，一次冷战三天后和好。\n\n各项之间的联系：\n- 论文和跑步用的是同一个办法——先把门槛降到很低再开始；数据清洗拆成 25 分钟小块和前一晚把跑鞋放门口，都发生在 8 月（AI 判断）。\n- 组会紧张和实习纠结的共同点是心里没底，把东西写下来（三句话结论、两条关键标准）之后都缓解了（AI 判断）。\n- 选 B 公司的理由是能接触真实出行数据，和论文方向直接相关（[[能接触真实数据比离学校近更重要]] 2026-09-28）。\n\n## 时间线\n- 2026-07-01 🟢 [[毕业论文]] 建档，暑假目标是数据清洗和文献综述\n- 2026-07-01 🟢 [[个人数据库]] 搭库\n- 2026-07-08 ❤️ [[对着空白的文献综述坐了一下午]] 一下午只写了一个标题\n- 2026-07-15 🟢 [[实习求职]] 开始准备找实习，改了一版简历\n- 2026-07-22 ❤️ [[组会前一晚改 PPT 改到一点]] 师姐教了写三句话的办法\n- 2026-07-26 📚 [[提示词怎么写得更具体]] 整理请 AI 写代码时的提示词写法\n- 2026-08-03 🟢 [[跑步计划]] 第一次跑步，跑走结合 3 公里\n- 2026-08-05 📚 [[《原子习惯》读书笔记]] 读完《原子习惯》\n- 2026-08-07 ❤️ [[跟阿凯说了想十二点以后安静点]] 先说需求，阿凯当晚戴上耳机\n- 2026-08-12 📚 [[跑步入门的心率区间]] 开始按二区心率慢跑\n- 2026-08-18 💡 [[数据清洗拆成小块两天就做完了]] 挂了三周的数据清洗拆小后做完\n- 2026-08-26 💡 [[三句话写出来以后 PPT 只是配图]] 第二次用三句话准备组会\n- 2026-08-28 🟢 [[实习求职]] 投了 12 家，A 公司笔试通过\n- 2026-08-30 ❤️ [[第一次不停跑完五公里]] 第一次不停跑完 5 公里\n- 2026-09-05 🛠️ [[B-Tools/Obsidian/Cockpit-Web/README|Cockpit-Web]] 开始用看板\n- 2026-09-06 ✈️ [[寒假去海边]] 有了寒假和妈妈去海边的想法\n- 2026-09-08 💡 [[开工的门槛是任务大小不是意志力]] 第三章开工\n- 2026-09-16 ❤️ [[组会被周老师追问基线模型]] 被追问基线，当晚睡不着\n- 2026-09-20 ❤️ [[先说需求反而让阿凯更不高兴]] 倒垃圾起冲突，冷战开始\n- 2026-09-23 💡 [[阿凯在意的是被安排不是倒垃圾]] 主动和好，明白了阿凯在意什么\n- 2026-09-24 ❤️ [[两个 offer 都来了反而更慌]] 两个 offer 同一周到\n- 2026-09-25 💬 [[和 AI 讨论两个实习 offer 怎么选]] 和 AI 聊怎么选\n- 2026-09-27 🟢 [[毕业论文]] LSTM 基线跑通\n- 2026-09-28 🟢 [[实习求职]] 决定去 B 公司\n- 2026-09-28 💡 [[能接触真实数据比离学校近更重要]] 想清楚真正起作用的两条标准\n\n## 关联链接\n- [[个人数据库]] —— 2026-10-01 巡检时生成\n","mtime":1792108800000},{"path":"C-Playbook/C-Situations/人际关系.md","text":"---\ntype: situation\ncreated: 2026-07-01\nupdated: 2026-10-01\n---\n## 定义\n和身边的人（目前主要是室友阿凯）有摩擦、需要开口沟通的时刻。\n\n## 洞见综述\n- 噪音那次连续三晚没吭声，第四晚才开口；先说自己要早起跑步，阿凯当晚就戴上了耳机（[[跟阿凯说了想十二点以后安静点]] 2026-08-07）。\n- 倒垃圾那次用了同样的说法，阿凯觉得像在开会，两人冷战三天（[[先说需求反而让阿凯更不高兴]] 2026-09-20）。\n- 「原来他在意的是被安排，不是活儿本身。」（[[阿凯在意的是被安排不是倒垃圾]] 2026-09-23）\n- 两次的差别可能在于：噪音那次的“需求”说的是自己要睡够，倒垃圾那次的“需求”听起来像在给对方派活（AI 判断）。\n\n## Insights\n- [[阿凯在意的是被安排不是倒垃圾]]（2026-09-23）\n\n## Strategies\n- [[室友摩擦先说需求再说事实]] 🔴 存疑\n","mtime":1792108800000},{"path":"C-Playbook/C-Situations/决策.md","text":"---\ntype: situation\ncreated: 2026-07-01\nupdated: 2026-10-01\n---\n## 定义\n要在几个选项里挑一个、而且选了不好回头的时刻。\n\n## 洞见综述\n- 两个 offer 同一周到，优缺点越列越乱（[[两个 offer 都来了反而更慌]] 2026-09-24）。\n- 「其实我心里早就偏 B 了，列那么多条是想找一个能说服自己选 A 的理由。」（[[和 AI 讨论两个实习 offer 怎么选]] 2026-09-25）\n- 「其他十几条都是在给自己找安全感。」（[[能接触真实数据比离学校近更重要]] 2026-09-28）\n- 清单越列越长，更可能是在推迟承担选择的结果，而不是真的缺信息（AI 判断）。\n- 这次的答复期限是 A 公司给的；没有外部期限时会怎样，还没有记录。\n\n## Insights\n- [[能接触真实数据比离学校近更重要]]（2026-09-28）\n\n## Strategies\n- [[两个选项都不差时给决定设截止日期]] ⚪ 待验证\n","mtime":1792108800000},{"path":"C-Playbook/C-Situations/压力.md","text":"---\ntype: situation\ncreated: 2026-07-01\nupdated: 2026-10-01\n---\n## 定义\n有人要评价、时间又逼近时的紧张，目前主要出现在组会汇报前后。\n\n## 洞见综述\n- 组会前的紧张集中在“说不清楚”上：「怕的不是周老师，是自己说不清楚。」（[[组会前一晚改 PPT 改到一点]] 2026-07-22）\n- 提前写三句话以后，汇报时心里有底，被提问也接得住（[[三句话写出来以后 PPT 只是配图]] 2026-08-26）。\n- 会上的紧张有了办法，会后的反复回想还没有：「三句话救了现场，但救不了晚上。」（[[组会被周老师追问基线模型]] 2026-09-16）\n- 反复改 PPT 的字体配色，像是在用“看起来在准备”来压住紧张（AI 判断）。\n\n## Insights\n- [[三句话写出来以后 PPT 只是配图]]（2026-08-26）\n\n## Strategies\n- [[组会前先写三句话结论]] 🟡 部分验证，缺第 2 步\n","mtime":1792108800000},{"path":"C-Playbook/C-Situations/启动-执行.md","text":"---\ntype: situation\ncreated: 2026-07-01\nupdated: 2026-10-01\n---\n## 定义\n知道该做、也想做，却迟迟开不了头的时刻；多出现在论文这类大而开放的任务上。\n\n## 洞见综述\n- 卡住的多是没有清楚第一步的大任务：整个下午只写了一个标题（[[对着空白的文献综述坐了一下午]] 2026-07-08）。\n- 「原来不是我不想做，是“数据清洗”这四个字没法下手。」（[[数据清洗拆成小块两天就做完了]] 2026-08-18）\n- 「开工的门槛是任务大小，不是我意志力差。」（[[开工的门槛是任务大小不是意志力]] 2026-09-08）\n- 拖的时候会去整理文件夹、刷手机，可能是在缓解开不了工的不安（AI 判断）。\n\n## Insights\n- [[数据清洗拆成小块两天就做完了]]（2026-08-18）\n- [[开工的门槛是任务大小不是意志力]]（2026-09-08）\n\n## Strategies\n- [[把论文拆到 25 分钟能开工的大小]] 🟡 部分验证\n","mtime":1792108800000},{"path":"C-Playbook/C-Situations/自我价值与意义感.md","text":"---\ntype: situation\ncreated: 2026-07-01\nupdated: 2026-09-01\n---\n## 定义\n觉得自己行不行、做的事有没有意义的时刻。\n\n## 洞见综述\n- 第一次不停跑完 5 公里，距第一次跑步 27 天（[[第一次不停跑完五公里]] 2026-08-30）。\n- 「跑完的开心跟论文被夸不一样：它不用等谁来评价，表上的数就在那。」（[[第一次不停跑完五公里]] 2026-08-30）\n- 自己能看见的进步，比别人的评价更直接地给他带来踏实感（AI 判断）。\n\n## Insights\n暂无。\n\n## Strategies\n暂无。\n","mtime":1792108800000},{"path":"C-Playbook/C-Strategies/两个选项都不差时给决定设截止日期.md","text":"---\ntype: strategy\ncreated: 2026-09-26\nupdated: 2026-10-16\nsituation: [\"[[决策]]\"]\n---\n> ⚪ 待验证 · 出现 0 次 · 执行 0 次（有效 0 / 无效 0 / 未记录 0）· 更新 2026-10-16\n> 出现：无\n> 执行：无\n\n还是待验证：这条只来自和 AI 的讨论和一本书；实习那次的期限是 A 公司给的，不是自己设的，还没有一次自己设截止日期的第一手记录。\n\n## Principle\n两个选项都不差、又没有外部期限时，先给决定定一个日子；到期按当时手上的信息选，不再追加比较。\n\n## 识别信号\n- 两个选项各有明显的好处，没有一个明显更差。\n- 没有人催，决定可以无限往后放。\n- 优缺点清单越列越长，新加的条目已经不改变倾向。\n\n## 机制\n（以下是通用说法，出处见来源栏；在你身上是否成立，还没有第一手记录）\n- 两个都不差时，选错的代价其实不大，拖着不选、反复比较的消耗反而更大。\n- 没有期限时，“再多查一点”永远显得合理；定下日期后，比较才有终点。\n\n## 破解步骤\n1. 发现自己在两个都不差的选项之间来回比较时，写下一个决定日期，一般不超过一周。\n2. 到期前只补真正缺的信息，比如问清到岗天数，不再加新的优缺点。\n3. 到期当天按当时的信息选，选完写一条记录，算一次执行。\n\n## 关联链接\n**证据**：暂无第一手记录\n**来源**：和 AI 讨论两个实习 offer 时 AI 提出的建议（2026-09-25）；《决断力》中给决定设期限的说法\n**相关**：\n- [[和 AI 讨论两个实习 offer 怎么选]] —— 这条策略的出处，里面是 AI 的分析，不算次数\n- [[决策]] —— 所属情境\n","mtime":1792108800000},{"path":"C-Playbook/C-Strategies/室友摩擦先说需求再说事实.md","text":"---\ntype: strategy\ncreated: 2026-08-08\nupdated: 2026-10-16\nsituation: [\"[[人际关系]]\"]\n---\n> 🔴 存疑 · 出现 0 次 · 执行 2 次（有效 1 / 无效 1 / 未记录 0）· 更新 2026-10-16\n> 出现：无\n> 执行：[[跟阿凯说了想十二点以后安静点]]（2026-08-07，有效）· [[先说需求反而让阿凯更不高兴]]（2026-09-20，无效）\n\n这条策略目前存疑：照着步骤做了两次，一次有效，一次无效，无效那次结果更糟。按规则存疑不删，先留在这里，等你决定改写还是归档。\n\n## Principle\n和室友有摩擦时，先说自己需要什么，再说发生了什么事实，不先指责。\n\n## 识别信号\n- 同一件小事已经憋了好几天没说：噪音连续三晚（[[跟阿凯说了想十二点以后安静点]] 2026-08-07）。\n- 心里冒出「想直接吼一句」（[[跟阿凯说了想十二点以后安静点]] 2026-08-07）。\n\n## 机制\n（本节为 AI 判断，依据见证据栏和反例栏）\n- 先说需求，对方能先知道你要什么，不用先防御“是不是在怪我”；对应原话：「先说我要什么，他就不用猜我是不是在指责他。」（[[跟阿凯说了想十二点以后安静点]] 2026-08-07）\n- 无效那次说明这个机制有边界：当“需求”说的是自己的处境（要睡够）时有用；当“需求”听起来像在给对方派活时，先说需求反而像讲道理，更让人反感。\n\n## 破解步骤\n1. 开口前想好一句“我需要……”，说的是自己的处境。\n2. 再说事实，只说发生了什么，不加“又”“总是”。\n3. 说完停下，等对方回应。\n\n## 关联链接\n**goal**：[[生活与体验]]\n**证据**：\n- [[跟阿凯说了想十二点以后安静点]]（2026-08-07）—— 先说早起跑步要睡够，再说被吵醒，阿凯当晚就戴上了耳机\n**反例**：\n- [[先说需求反而让阿凯更不高兴]]（2026-09-20）—— 照步骤说“我需要宿舍干净一点”，阿凯觉得像在开会，冷战三天\n**证据集中度（供审计）**：9 月 23 日那条 insight（阿凯在意的是被安排）是 9 月 20 日同一次冲突的后续，与那次执行合算 1 次，不另计。\n**来源**：读过的沟通类文章里“先说需求，再说事实”的说法，出处没记\n**相关**：\n- [[人际关系]] —— 所属情境\n","mtime":1792108800000},{"path":"C-Playbook/C-Strategies/把论文拆到 25 分钟能开工的大小.md","text":"---\ntype: strategy\ncreated: 2026-08-19\nupdated: 2026-10-16\nsituation: [\"[[启动-执行]]\"]\n---\n> 🟡 部分验证 · 出现 1 次 · 执行 2 次（有效 2 / 无效 0 / 未记录 0）· 更新 2026-10-16\n> 出现：[[对着空白的文献综述坐了一下午]]（2026-07-08）\n> 执行：[[数据清洗拆成小块两天就做完了]]（2026-08-18，有效）· [[开工的门槛是任务大小不是意志力]]（2026-09-08，有效）\n\n7 月 8 日那次只是问题出现了，没有照着拆，所以不抬高等级；照着做并且有用的有两次，还差一次到 🟢。\n\n## Principle\n开不了工时，问题多半出在任务太大、看不见第一步。先把它拆到“25 分钟内能开始、能做完一小块”的大小，再开工。\n\n## 识别信号\n- 待办里挂着一个名词式的大任务，挂了好几周没动：“数据清洗”挂了三周（[[数据清洗拆成小块两天就做完了]] 2026-08-18）。\n- 打开文档后整理文件夹、刷手机，几个小时没有产出（[[对着空白的文献综述坐了一下午]] 2026-07-08）。\n- 「可能是“写综述”这个任务太大了，我根本不知道第一步是什么。」（[[对着空白的文献综述坐了一下午]] 2026-07-08）\n\n## 机制\n（本节为 AI 判断，依据见证据栏）\n- 大任务没有清楚的第一步，开工前得先做一次“从哪开始”的决定，这个决定本身就累，于是被一再推后。\n- 拆到 25 分钟一块后，“开始”和“做完”都看得见，启动成本低到可以直接动手；动起来以后，往往会超过 25 分钟。\n\n## 破解步骤\n1. 把大任务写成动词开头、一句话说得完的小块，每块估计不超过 25 分钟，比如“写 LSTM 输入怎么构造这一段”。\n2. 只挑第一块，定 25 分钟计时，开工。\n3. 时间到了想继续就继续；不想就停，在 [[毕业论文]] 的下一步里写下一块是什么。\n\n## 关联链接\n**goal**：[[学业]]\n**证据**：\n- [[对着空白的文献综述坐了一下午]]（2026-07-08）—— “写综述”太大、没有第一步，一下午没开工，模式出现、机制解释得通（出现，不抬高等级）\n- [[数据清洗拆成小块两天就做完了]]（2026-08-18）—— 数据清洗拆成六块、每块 25 分钟，挂了三周的事两天做完\n- [[开工的门槛是任务大小不是意志力]]（2026-09-08）—— 第三章从一小段写起，25 分钟后停不下来\n**来源**：《原子习惯》中的两分钟法则；番茄工作法以 25 分钟为一段的做法\n**相关**：\n- [[《原子习惯》读书笔记]] —— 读书时记下的两分钟法则\n- [[启动-执行]] —— 所属情境\n","mtime":1792108800000},{"path":"C-Playbook/C-Strategies/组会前先写三句话结论.md","text":"---\ntype: strategy\ncreated: 2026-07-22\nupdated: 2026-10-16\nsituation: [\"[[压力]]\"]\n---\n> 🟡 部分验证 · 出现 0 次 · 执行 3 次（有效 3 / 无效 0 / 未记录 0）· 更新 2026-10-16 · 缺第 2 步\n> 出现：无\n> 执行：[[组会前一晚改 PPT 改到一点]]（2026-07-22，有效）· [[三句话写出来以后 PPT 只是配图]]（2026-08-26，有效）· [[组会被周老师追问基线模型]]（2026-09-16，有效）\n\n三次执行都是第 1 步；第 2 步还没执行过，所以整条最高到 🟡。\n\n## Principle\n组会前别先改 PPT，先用三句话写清结论：做了什么、结果怎样、卡在哪。会后五分钟把被问到的问题记下来，别带回宿舍反复想。\n\n## 识别信号\n- 组会前一晚反复改 PPT 的字体和配色，内容没变（[[组会前一晚改 PPT 改到一点]] 2026-07-22）。\n- 心里预演周老师会问什么：总觉得会被问“你这周都干嘛了”（[[组会前一晚改 PPT 改到一点]] 2026-07-22）。\n- 组会后当晚在脑子里重放被追问的场景（[[组会被周老师追问基线模型]] 2026-09-16）。\n\n## 机制\n（本节为 AI 判断，依据见证据栏）\n- 紧张的对象是“说不清楚”，改 PPT 是在做一件看起来相关、其实不解决问题的事。\n- 三句话一写出来，“我能说清楚”就有了凭据，紧张随之下降；被打断时也有地方可以回去。\n- 会后反复回想，是因为被问到的问题没有落到纸上，脑子只好一直替你记着。\n\n## 破解步骤\n1. **第 1 步 · 写三句话结论**：组会前花十分钟，写下做了什么、结果怎样、卡在哪，各一句。PPT 只给这三句话配图。\n2. **第 2 步 · 会后五分钟复盘**：散会后五分钟内，把被问到的问题和想补的回答写进 [[毕业论文]] 的下一步，写完就不再想。\n\n## 关联链接\n**goal**：[[学业]]\n**证据**（第 1 步）：\n- [[组会前一晚改 PPT 改到一点]]（2026-07-22）—— 第一次照师姐的建议写三句话，写完不慌了，组会顺利\n- [[三句话写出来以后 PPT 只是配图]]（2026-08-26）—— 第二次照做，被问到缺失值也接得住\n- [[组会被周老师追问基线模型]]（2026-09-16）—— 被连续追问时，靠提前写好的三句话接回了汇报\n**证据**（第 2 步）：暂无\n**仍缺**：第 2 步“会后五分钟复盘”还没有一次照做的记录；9 月 16 日那次会后没有复盘，当晚一直在回想被追问的问题。\n**来源**：师姐小钟的建议（记在第 1 步的第一条证据里）\n**相关**：\n- [[压力]] —— 所属情境\n","mtime":1792108800000},{"path":"C-WhoRU.md","text":"---\ntype: profile\ncreated: 2026-08-01\nupdated: 2026-10-14\n---\n## 画像\n更新 2026-10-01\n\n### 是什么样的人\n- 交通工程研二，毕业论文做短时交通流预测，导师周老师（[[毕业论文]] 2026-07-01）\n- 大而模糊的任务容易拖，拖的时候会整理文件夹、刷手机（[[对着空白的文献综述坐了一下午]] 2026-07-08）\n- 拆小以后开工很快：「开工的门槛是任务大小，不是我意志力差。」（[[开工的门槛是任务大小不是意志力]] 2026-09-08）\n- 组会前容易紧张，紧张点在说不清楚：「怕的不是周老师，是自己说不清楚。」（[[组会前一晚改 PPT 改到一点]] 2026-07-22）\n- 组会被追问后，当晚会反复回想（[[组会被周老师追问基线模型]] 2026-09-16）\n- 做选择时会列很长的优缺点清单，真正起作用的只有一两条（[[能接触真实数据比离学校近更重要]] 2026-09-28）\n- 心里往往早有倾向，列清单是在找说服自己的理由（AI 判断）（[[和 AI 讨论两个实习 offer 怎么选]] 2026-09-25）\n- 和室友有摩擦时会先忍几天再开口（[[跟阿凯说了想十二点以后安静点]] 2026-08-07）\n- 8 月开始跑步，已能不停跑 5 公里，喜欢看得见的进步（[[第一次不停跑完五公里]] 2026-08-30）\n- 常用 AI 写代码、讨论选择，习惯把原始材料直接贴给 AI（[[提示词怎么写得更具体]] 2026-09-25）\n\n### 和他打交道要注意\n- 给建议时先给一个今天就能开工的小步骤，只给大方向容易被搁置（AI 判断）（[[把论文拆到 25 分钟能开工的大小]] 2026-10-01）\n- 帮他做选择时，问“如果条件一样选哪个”比继续加优缺点有用（[[和 AI 讨论两个实习 offer 怎么选]] 2026-09-25）\n- 组会前一天他的紧张度偏高，不适合临时加新任务（AI 判断）（[[组会前一晚改 PPT 改到一点]] 2026-07-22）\n- 室友话题：“先说需求”的说法目前存疑，别直接推荐（[[室友摩擦先说需求再说事实]] 2026-10-01）\n\n## 近况\n更新 2026-10-14\n\n### 在做什么\n- 第三章初稿 10 月 25 日交周老师，10 月 12 日写到 3.3 节（[[毕业论文]] 2026-10-12）\n- 实习定了 B 公司，11 月 2 日入职，每周到岗三天，周老师已同意（[[实习求职]] 2026-10-08）\n- 跑步：10 月 11 日慢跑 6 公里，10 公里校园跑 10 月 20 日截止报名（[[跑步计划]] 2026-10-11）\n\n### 最近状态\n- 国庆回家，妈妈在亲戚面前夸他，开心里有点心虚（[[国庆回家妈妈跟亲戚夸我]] 2026-10-03）\n- 宿舍：和阿凯一起排了值日表（[[日常事务]] 2026-10-09）\n- 0-Unclear 有 1 条待选（[[慢一点也没关系指什么]] 2026-10-11）；0-Inbox 有 1 条未整理（[[随手记-1014]] 2026-10-14）\n\n### 这几天要注意\n- 10 月 20 日有两个截止：实习协议寄回、校园跑报名（[[实习求职]] 2026-10-08；[[跑步计划]] 2026-10-11）\n- 第三章是大任务，7 月写综述时出现过一下午开不了工（[[对着空白的文献综述坐了一下午]] 2026-07-08）\n- 组会后容易睡不好，会后复盘那一步还没有记录（[[组会前先写三句话结论]] 2026-10-01）\n\n## 关联链接\n- [[个人数据库]] —— 画像每月第一次巡检时重写，改动记在巡检日志\n","mtime":1792108800000},{"path":"CLAUDE.md","text":"# 个人数据库 · AI 执行规则\n\n> 本库记录并蒸馏用户的经历，为用户打造专属的 AI 上下文。\n> 本文件是库的说明书，也是**唯一真相**：有什么、放在哪、长什么样、什么不许做。做事的步骤写在 skill 里（第三节）。变更记在 [[个人数据库]] 进展日志。设计意图见仓库的 `docs/`。\n> 这是模板：第零节的对话原则、第七节的 goal / situation / field 取值都是示例，按你自己的改。\n\n## 零、对话原则\n\n1. 回答客观，不为照顾用户情绪隐瞒信息与结论。\n2. 先总结，再细节，最后逐条列需要用户决定的点。\n\n## 一、铁律\n\n0. **本文件优先**：操作本库一律按本文件；用户明确要求破例时照做，做完问要不要写进规则。\n1. **原话逐字保留**：B 层原始记录与 A 层进展日志只增不改，不改写、不美化、不摘要；AI 只可移动、加 frontmatter、加或修链接、调排版。\n2. **只归档不删**：结束的项目、旅行移入 A-Archive（6.1）。确需清掉的（处理完的 Unclear、确认过的纯空壳）移进 `.trash/`，不真删。\n3. **不明就放 Unclear**：类型不明、信息不足、意图多义、需要确认、词表外的新类别，放 `0-Unclear/`，不猜。\n4. **文件名由 AI 从内容提炼**。\n5. **frontmatter 不编造**：没提到的留空。\n6. **判断不落盘**：看板只列事实；好坏对错、今天该干什么只在对话里说。C 层可写 AI 对用户的推测，但须标「（AI 判断）」并附证据（4.1）。\n7. **用户定规则，AI 管内容**：归类、蒸馏、维护是 AI 的活；本文件只在用户要求时改。\n8. **移动、改名不断链**：改名或移动后，把全库指向它的链接（`[[旧名]]`、带路径的 `[[旧路径/…]]`）一并改掉，再查一遍没有断链。\n\n## 二、目录结构\n\n```\n0-Inbox/                 入口 · 用户想存的一切，AI 归位后清空\n0-Unclear/               入口 · AI 判断不了的，写成选择题等用户勾\n\nA-Projects/              执行 · 正在筹备和进行的事\nA-Holidays/              执行 · 旅行计划与想法\nA-Archive/               执行 · 已结束的事与旅行（只读）\n\nB-Emotions/              记录 · 情绪（事件 → 心理活动 → 感悟）\nB-Insights/              记录 · 想法与摘录，向内\nB-Topics/\u003c大类>/          记录 · 主题学习与领域知识，向外\nB-Dialogues/             记录 · 和 AI 关于某件事的讨论\nB-Tools/\u003c大类>/\u003c项目>/    记录 · 用户做的产品\nB-Info/                  记录 · 个人资料索引（不存隐私原文）\nB-Meals/                 记录 · 每日饮食营养（AI 由照片估算，不存照片）\n\nC-Playbook/\n  ├ C-Strategies/        蒸馏 · 应对策略\n  └ C-Situations/        蒸馏 · 情境综述\nC-Knowledge/             蒸馏 · 知识体系\nC-Memoirs/               蒸馏 · 季度回忆录\nC-WhoRU.md               蒸馏 · 用户侧写：画像（月更）+ 近况（日更）\n\nCLAUDE.md                本文件\nAGENTS.md                本文件的原样副本（供 Codex 等读 AGENTS.md 的工具），勿单独改\n.claude/skills/          做事的步骤：入库、巡检\n```\n\nA 执行（有状态、会结束）· B 记录（第一手素材）· C 蒸馏（AI 合成，可重跑）。\n\n## 三、做事\n\n用户每说一句话，先看它是哪一种，可以同时是几种：\n\n| 它是 | 怎么做 |\n|---|---|\n| 提问（「我最近……？」「上次……怎么处理的？」） | 按 3.2 查库作答，不入库 |\n| 交代一件事（写邮件、改简历、分析数据） | 去做；做的过程中冒出的决定、进展、感受照样入库 |\n| 说出以后还用得上的事：事实、进展、决定、感受、想法，或发来照片、说「记一下」「整理收件箱」 | 按 `.claude/skills/vault-filing/SKILL.md` 入库 |\n| 每周巡检，或说「巡检」「蒸馏一下」 | 按 `.claude/skills/vault-inspection/SKILL.md` |\n\n能自动加载 skill 的工具会自己读；不能的，直接读上面的文件。\n\n**skill 没写到的事**：按铁律和本文件自己判断，去做。能撤回的直接做，做完说明；撤不回的（删除、改本文件、对外发送）先问用户。同一类事第三次出现，提议写成 skill。\n\n### 3.1 不入库\n- 项目工作文档（PPT 稿、方案稿等）。\n- 只服务当前工作的安排（如近期优先级），留在对话里。\n- 噪音、临时信息：丢掉，在回复里说丢了什么。\n\n### 3.2 查询\n1. 了解用户本人，先读 `C-WhoRU.md`，再顺链接深挖；它只是索引，引用事实以原记录为准。\n2. 按 frontmatter（type / situation / emotiontype / field / goal）和文件名筛选，只读命中的少数文件及其关联链接。\n3. 作答时说明查了哪些范围、可能漏了什么。\n\n### 3.3 蒸馏\n- 只在用户要求或巡检时做，不自动生成；新情境类别、新 knowledge 体系先提议。\n- 必须带 **证据** / **反例** 反链，结论前置，可随时重跑。\n\n## 四、通用格式\n\n- frontmatter 只放分类轴（这是什么），`---` 在第一行；关系写在正文 `## 关联链接`（牵连谁 + 为什么）。\n- 正文从 `##` 开始，最深 `####`，每篇最多一个 `#`；分节用标题，不用 `**加粗标签**：`（`## 关联链接` 里的栏名除外）。一篇只讲一个主题。\n- 日期 `YYYY-MM-DD`；数组行内写 `[a, b]`；列表用 `-`，子级缩进 2 空格；段落间空一行。\n- 中英文、中文与数字之间加空格；中文用全角标点；粗体只给关键词或结论；代码块声明语言；图片用 `![[图片名.png]]`。\n- `## 关联链接` 写法：\n\n```markdown\n## 关联链接\n**goal**：[[学业]]\n**证据**：\n- [[某emotion记录]] —— 一句话说明为什么关联\n**来源**：《原子习惯》\n```\n\n### 4.1 原话与 AI 判断分开（C 层全部文件）\n- **用户原话**放「」，紧跟出处：`「能查的先查完，剩下的交给时间」（[[实习求职]] 2026-09-28）`。逐字，不拼接。\n- **记录里的事实**带出处链接，不标注。\n- **AI 的推测**（动机、模式、原因、没说出口的感受）句末标「（AI 判断）」；整节都是推测时，节首写一次 `（本节为 AI 判断，依据见证据栏）`。拿不准的按推测标。\n- **书、理论、播客**写进 **来源** / **理论依据**，不标。\n- 规则生效前写的 C 文件，下次修改时补标，不集中回填。\n\n## 五、类型速查表\n\n| type | 目录 | frontmatter（type 之外） | 正文结构 |\n|---|---|---|---|\n| `project` | A-Projects → A-Archive | goal, status, created, updated | 项目描述 → 下一步 → 进展日志 → 关联链接 |\n| `holiday` | A-Holidays → A-Archive | status, start, created, updated | 自由 → 关联链接 |\n| `emotion` | B-Emotions | created, situation, emotiontype | 客观事件 → 心理活动 → 感悟（可空）→ 这件事我跟谁说了（可空）→ 关联链接 |\n| `insight` | B-Insights | created, situation | 内容（原文逐字）→ 关联链接 |\n| `topic` | B-Topics/\u003c大类> | created, updated, field | 自由 → 关联链接 |\n| `dialogue` | B-Dialogues | created, updated | 自由 → 关联链接 |\n| `readme` / `changelog` | B-Tools/\u003c大类>/\u003c项目> | created, updated | 功能描述 + 各节 → 关联链接 |\n| `info` | B-Info | created, updated | 自由 |\n| `meal` | B-Meals | created, updated | 各餐 → 当日合计 → 关联链接（6.12） |\n| `strategy` | C-Strategies | created, updated, situation | 证据等级区 → Principle → 识别信号 → 机制 → 破解步骤 → 关联链接 |\n| `situation` | C-Situations | created, updated | 定义 → 洞见综述 → Insights → Strategies |\n| `knowledge` | C-Knowledge | created, updated, field | 总领 → 知识地图 → 关系 → 缺口 → 关联链接 |\n| `memoir` | C-Memoirs | period, created, updated | 季度综述 → 时间线 |\n| `unclear` | 0-Unclear | created | 见 6.7 |\n| `profile` | 库根目录 `C-WhoRU.md` | created, updated | 画像 → 近况 → 关联链接（6.11） |\n\n- emotion、insight 写完即冻结，只有 created。\n- topic、tool、info、knowledge 不设 status；没做完的事由 project 追踪。\n\n## 六、补充规则\n\n### 6.1 project\n- 进展日志每条一个 `### YYYY-MM-DD`，倒序，关键词加粗，保留弯路。\n- 小事写成 `下一步` 里的 `- [ ]`，硬 deadline 加 📅；无归属的杂事进 [[日常事务]]。\n- `status: done`（含中途终止，日志注明）后移入 A-Archive，原文不改。\n\n### 6.2 holiday\n- 状态同 project：planned（想法 / 筹备）→ active（已订 / 出行中）→ done。\n- 旅途感受记 emotion，行程讨论记 dialogue，都链回本行程。\n\n### 6.3 dialogue\n- 关联的 project、holiday、insight 写进关联链接，不强制分流。\n- 需要时加一行 `**性质**：与 AI 深谈整理，含推测成分`。\n\n### 6.4 tool\n- 一个项目一个文件夹：`README.md`（怎么用、为什么这样设计）+ `CHANGELOG-vN.md`（决策、踩坑、进度）；接力文档、工作日志的 type 取两者中更贴的一个。旧文件不追溯改名。\n- 链接 tool 项目指向它的 README：`[[B-Tools/\u003c大类>/\u003c项目>/README|\u003c项目>]]`。\n\n### 6.5 memoir\n- 一季一份，巡检时生成，写法见巡检 skill。\n\n### 6.6 knowledge\n- 一份文件 = 一个知识体系；单个知识点写在 B-Topics。写法见巡检 skill。\n\n### 6.7 unclear 模板\n```markdown\n## 原始记录\n（用户原话逐字）\n\n## 判断选项\n（1–2 句：为什么不明 + AI 最佳猜测）\n- [ ] **A**（推荐）：具体处置一句话\n- [ ] **B**：备选\n- [ ] **C**：其他 / 我自己写\n\n## 关联链接\n```\n用户勾选后，AI 照选项处理，再把这份 Unclear 移进 `.trash/`。\n\n### 6.8 info\n- 只记「有什么、在哪」，不写证件号、密码等原文；不参与蒸馏。\n\n### 6.9 看板\n- 只有网页版 [[B-Tools/Obsidian/Cockpit-Web/README|Cockpit-Web]]（仓库里的 `cockpit-web/index.html`）：浏览器读库，只读，只放机械统计，不写判断。\n\n### 6.10 strategy 证据等级\n- **等级区**：frontmatter 下第一段，三行引用块：\n  ```\n  > 🟡 部分验证 · 出现 3 次 · 执行 2 次（有效 1 / 无效 0 / 未记录 1）· 更新 2026-10-16\n  > 出现：[[记录A]]（2026-07-21）· [[记录B]]（2026-08-04）· [[记录C]]（2026-09-30）\n  > 执行：[[记录D]]（2026-09-18，有效）· [[记录E]]（2026-09-28，未记录）\n  ```\n  某栏没有就写「无」；多步策略有一步从没做过，第一行末尾加「· 缺第 N 步」；说明另起一段。\n- **四档**只看照做后的结果，出现次数不抬高等级：\n  - 🔴 存疑：无效（含反例）≥ 1，且无效 ≥ 有效\n  - ⚪ 待验证：有效 0 次\n  - 🟡 部分验证：有效 1–2 次\n  - 🟢 已验证：有效 ≥ 3 次；有「缺第 N 步」的最高到 🟡\n- 怎么计数、什么时候重算：见巡检 skill。\n- 存疑的策略不删，由用户决定改写还是归档。\n\n### 6.11 profile（`C-WhoRU.md`）\n- 作用：任何 AI 一打开就知道用户是什么样的人、在忙什么、要注意什么。\n- `## 画像`：目标、长处短板、常见模式、和他打交道要注意的。每月第一次巡检整节重写，≤ 30 行。\n- `## 近况`：在做什么、最近状态、这几天要注意的。每天由定时任务（如 08:00 的早间简报）整节重写，只改这一节，≤ 15 行。\n- 两节第一行都写 `更新 YYYY-MM-DD`；每条带出处和日期，原话放「」，推测标「（AI 判断）」。\n- 情绪只写一行概括 + 链接，不抄原文；不写只服务当前工作的安排和隐私原文。\n- 其他 C 文件不得拿它当证据，要引用就引用它链接的原记录。\n- 「这几天要注意」每天整份重写、不会过期，不违反铁律 6；只写记录能支持的提醒，不替用户定计划。\n\n### 6.12 meal（饮食）\n- 一天一个文件 `B-Meals/YYYY-MM-DD.md`；同一天再有一餐就追加，改 `updated`。\n- 用户发来照片，AI 认出食物、估算份量和营养，只记数据，不存照片；用户给的准确数据（营养标签、称重）照抄并注明。\n- 每餐一节（`## 早餐` / `## 午餐` / `## 晚餐` / `## 加餐`），一张表：\n\n  | 食物 | 份量 (g) | 热量 (kcal) | 蛋白质 (g) | 脂肪 (g) | 碳水 (g) |\n  |---|---|---|---|---|---|\n\n  表下写 `（AI 估算，依据照片）`；认不准的照样写，后面标「（不确定）」。\n- `## 当日合计` 把各列加总；「吃多了」这类判断只在对话里说。\n- `## 关联链接` 写 `**goal**：[[身体健康]]`。\n\n## 七、字段取值表\n\n| 字段 | 用于 | 写法 | 取值 |\n|---|---|---|---|\n| `type` | 全部 | 单值 | project · holiday · emotion · insight · topic · dialogue · readme · changelog · info · strategy · situation · knowledge · memoir · unclear · profile · meal |\n| `status` | project、holiday | 单值 | planned · active · done |\n| `created` | 全部 | `YYYY-MM-DD` | 建档日期 |\n| `updated` | 除 emotion、insight、unclear 外全部 | `YYYY-MM-DD` | 最近一次实质修改的日期 |\n| `start` | holiday | `YYYY-MM-DD` | 出发日期，未定留空 |\n| `period` | memoir | `YYYY-QN` | 如 `2026-Q3` |\n| `goal` | project | 单值 wikilink：`\"[[学业]]\"` | [[学业]] · [[职业发展]] · [[身体健康]] · [[生活与体验]] · [[终身学习]] |\n| `situation` | emotion、insight、strategy | wikilink 数组：`[\"[[决策]]\", \"[[压力]]\"]` | 启动-执行 · 压力 · 决策 · 人际关系 · 自我价值与意义感 · 规划 |\n| `emotiontype` | emotion | wikilink 数组：`[\"[[fear]]\", \"[[sadness]]\"]` | anger · disgust · fear · joy · peace · poignant · sadness · shame · surprise |\n| `field` | topic（只放一个）、knowledge（可多个） | wikilink 数组：`[\"[[AI]]\"]` | AI · 身心 · 金融 · 科研方法 · 阅读 · 工具 |\n\n- **只用表中取值**；要新增，放 `0-Unclear/` 或向用户提议。goal、situation、field 由用户增删。\n- **situation** 对应 C-Situations 下的实体文件；**emotiontype** 由 AI 按记录推断；**goal、emotiontype、field** 和 **来源** 栏的链接都是虚拟概念，不新建文件。\n- 非 project 属于某 goal 时，写在 `## 关联链接`：`**goal**：[[某goal]]`；涉及身体健康的一律挂 [[身体健康]]。\n- **field** 等于 B-Topics 的大类目录名；topic 的 field 必须等于所在目录，移动时同步改。\n","mtime":1792108800000}],"dirs":["0-Inbox","0-Unclear","A-Archive","A-Holidays","A-Projects","B-Dialogues","B-Emotions","B-Info","B-Insights","B-Tools","B-Tools/Obsidian","B-Tools/Obsidian/Cockpit-Web","B-Topics","B-Topics/AI","B-Topics/身心","B-Topics/阅读","C-Knowledge","C-Memoirs","C-Playbook","C-Playbook/C-Situations","C-Playbook/C-Strategies"]}</script>

function today(){ if(state.fixedToday) return parseDate(state.fixedToday); const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function parseDate(s){ const m = /(\d{4})-(\d{2})-(\d{2})/.exec(String(s ?? '')); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function dd(a, b){ return Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate()) - new Date(a.getFullYear(),a.getMonth(),a.getDate())) / DAY); }
function p2(n){ return String(n).padStart(2,'0'); }
function fmtMD(d){ return d ? `${p2(d.getMonth()+1)}-${p2(d.getDate())}` : '—'; }
function ymd(d){ return `${d.getFullYear()}-${fmtMD(d)}`; }
function relDay(d){
  const n = dd(today(), d);
  if(n === 0) return '今天'; if(n === 1) return '明天'; if(n === -1) return '昨天';
  return n > 0 ? `${n} 天后` : `${-n} 天前`;
}
function wl(v){ if(v == null) return ''; const s = Array.isArray(v) ? v[0] : v; const m = /\[\[([^\]|#]+)/.exec(String(s)); return (m ? m[1] : String(s ?? '')).trim(); }
function wls(v){ if(v == null) return []; return (Array.isArray(v) ? v : [v]).map(wl).filter(Boolean); }
function inline(s){
  s = String(s ?? '').replace(/📅\s*\d{4}-\d{2}-\d{2}/g,'').replace(/✅\s*\d{4}-\d{2}-\d{2}/g,'');
  let out = esc(s);
  out = out.replace(/!?\[\[([^\]|]+?)(?:\|([^\]]+))?\]\]/g, (m,a,b) => `<span class="wl">${b || a.split('#')[0].split('/').filter(Boolean).pop() || a}</span>`);
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  return out.trim();
}
function plain(s){ return inline(s).replace(/<[^>]+>/g, ''); }
function oLink(path){ return `obsidian://open?vault=${encodeURIComponent(state.vaultName)}&file=${encodeURIComponent(path.replace(/\.md$/i,''))}`; }
function fileLink(f, label){ return state.source && state.source.kind === 'demo' ? `<span class="wl">${esc(label ?? f.base)}</span>` : `<a href="${oLink(f.path)}">${esc(label ?? f.base)}</a>`; }
function stripCode(s){ return s.replace(/```[\s\S]*?```/g,'').replace(/`[^`\n]*`/g,''); }
function tableView(head, rows){
  if(!rows.length) return '';
  return `<details class="tv"><summary>表格视图</summary><table><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${
    rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></details>`;
}

/* ================= frontmatter ================= */
function unq(v){
  v = String(v).trim();
  if((v.startsWith('"') && v.endsWith('"') && v.length > 1) || (v.startsWith("'") && v.endsWith("'") && v.length > 1)) return v.slice(1, -1);
  return v.replace(/\s+#.*$/, '');
}
function splitList(s){
  const out = []; let cur = '', depth = 0, q = null;
  for(const ch of s){
    if(q){ cur += ch; if(ch === q) q = null; continue; }
    if(ch === '"' || ch === "'"){ q = ch; cur += ch; continue; }
    if(ch === '[') depth++;
    if(ch === ']') depth--;
    if(ch === ',' && depth === 0){ out.push(cur); cur = ''; continue; }
    cur += ch;
  }
  if(cur.trim()) out.push(cur);
  return out.map(x => x.trim());
}
function parseFrontmatter(text){
  text = String(text).replace(/^﻿/, '').replace(/\r\n?/g, '\n');
  if(!text.startsWith('---\n')) return {fm:{}, body:text};
  const end = text.indexOf('\n---', 3);
  if(end < 0) return {fm:{}, body:text};
  const raw = text.slice(4, end);
  const body = text.slice(end + 4).replace(/^[^\n]*\n?/, '');
  const fm = {}; let key = null;
  for(const line of raw.split('\n')){
    const li = /^\s*-\s+(.*)$/.exec(line);
    if(li && key && (fm[key] === null || Array.isArray(fm[key]))){
      if(!Array.isArray(fm[key])) fm[key] = [];
      fm[key].push(unq(li[1])); continue;
    }
    const kv = /^([A-Za-z_][\w-]*):\s*(.*)$/.exec(line);
    if(!kv) continue;
    key = kv[1]; const v = kv[2].trim();
    if(v === ''){ fm[key] = null; continue; }
    if(v.startsWith('[') && v.endsWith(']') && !/^\[\[[^\]]*\]\]$/.test(v)) fm[key] = splitList(v.slice(1, -1)).map(unq).filter(Boolean);
    else fm[key] = unq(v);
  }
  return {fm, body};
}

/* ================= 解析项目：待办 & 进展日志 ================= */
function extractTasks(f){
  const out = []; let section = '', inCode = false;
  for(const line of f.body.split('\n')){
    if(/^\s*```/.test(line)){ inCode = !inCode; continue; }
    if(inCode) continue;
    const hm = /^##\s+(.+)$/.exec(line);
    if(hm){ section = hm[1].trim(); continue; }
    const m = /^(\s*)[-*] \[(.)\]\s+(.*)$/.exec(line);
    if(!m) continue;
    const text = m[3];
    const due = (/📅\s*(\d{4}-\d{2}-\d{2})/.exec(text) || [])[1];
    out.push({text, done:/[xX]/.test(m[2]), due: due ? parseDate(due) : null, waiting:/⏳/.test(text), section, file:f});
  }
  return out;
}
/* 旅行方案里常见的表格式待办：| 优先级 | 事项 | ☐ / ☑ | */
function extractTableBoxes(f){
  const out = [];
  for(const line of f.body.split('\n')){
    if(!/^\s*\|/.test(line) || !/[☐☑✅]/.test(line)) continue;
    const cells = line.split('|').map(c => c.trim()).filter(Boolean);
    const box = cells.find(c => /^[☐☑✅]$/.test(c));
    if(!box) continue;
    const text = cells.filter(c => c !== box).sort((a, b) => b.length - a.length)[0] || '';
    const pri = cells.find(c => /^[🔴🟠🟡🟢]$/u.test(c)) || '';
    out.push({text, pri, done: box !== '☐'});
  }
  return out;
}
function extractLogs(f){
  const lines = f.body.split('\n'); const logs = [];
  lines.forEach((l, i) => {
    const m = /^###\s+(\d{4}-\d{2}-\d{2})\s*(.*)$/.exec(l);
    if(!m) return;
    let title = m[2].replace(/^\s*(（[^）]*）)?\s*[·\-—:：]?\s*/, '').trim();
    if(!title){
      for(let j = i + 1; j < lines.length && j < i + 8; j++){
        const t = lines[j].trim();
        if(!t) continue;
        if(/^#/.test(t)) break;
        title = t.replace(/^[-*>]\s*/, ''); break;
      }
    }
    logs.push({date:parseDate(m[1]), title});
  });
  return logs.sort((a, b) => b.date - a.date);
}

/* ================= 读取数据源 ================= */
async function readHandle(root){
  const files = [], dirs = [], jobs = [];
  async function walk(dir, prefix){
    for await (const [name, h] of dir.entries()){
      if(name.startsWith('.')) continue;
      const p = prefix ? `${prefix}/${name}` : name;
      if(h.kind === 'directory'){ dirs.push(p); await walk(h, p); }
      else if(/\.md$/i.test(name)) jobs.push(h.getFile().then(async file => { files.push({path:p, text:await file.text(), mtime:file.lastModified}); }));
    }
  }
  await walk(root, '');
  await Promise.all(jobs);
  return {name:root.name, files, dirs};
}
async function readFileList(list){
  const files = [], dirSet = new Set(); let name = '';
  await Promise.all([...list].map(async f => {
    const parts = (f.webkitRelativePath || f.name).split('/');
    name = parts[0];
    const rel = parts.slice(1);
    if(!rel.length || rel.some(s => s.startsWith('.'))) return;
    for(let i = 1; i < rel.length; i++) dirSet.add(rel.slice(0, i).join('/'));
    if(!/\.md$/i.test(f.name)) return;
    files.push({path:rel.join('/'), text:await f.text(), mtime:f.lastModified});
  }));
  return {name, files, dirs:[...dirSet], noDirInfo:true};
}

/* ================= 规则：从 CLAUDE.md 读目录表与字段取值 ================= */
function loadRules(raw){
  const f = raw.files.find(x => x.path === 'CLAUDE.md');
  const text = f ? String(f.text).replace(/\r\n?/g, '\n') : '';
  // 「七、字段取值表」里形如 | `goal` | … | [[目标A]] · [[目标B]] | 的行，取最后一格
  const row = key => {
    const m = new RegExp('^\\|\\s*`' + key + '`\\s*\\|.*\\|\\s*([^|\\n]+?)\\s*\\|\\s*$', 'm').exec(text);
    return m ? m[1].split('·').map(s => s.replace(/\[\[|\]\]|`/g, '').trim()).filter(Boolean) : null;
  };
  // 「二、目录结构」代码块：顶格的 xxx/ 是顶层目录，顶格的 xxx.ext 是根目录文件，缩进的 ├ xxx/ 是上一个顶层目录的子目录
  let dirs = null, roots = null;
  const parentOf = {};
  const tree = /##[^\n]*目录结构[^\n]*\n+```[^\n]*\n([\s\S]*?)```/.exec(text);
  if(tree){
    const d = [], r = []; let cur = '', m;
    for(const line of tree[1].split('\n')){
      if((m = /^([^\s.├└│][^/\s]*)\//.exec(line))){ cur = m[1]; d.push(cur); }
      else if((m = /^([^\s├└│].*?\.[A-Za-z]+)(\s{2,}|$)/.exec(line))) r.push(m[1]);   // 文件名里可以有单个空格，和说明之间至少两个空格
      else if(cur && (m = /^\s+[├└│]?\s*([^\s/]+)\//.exec(line))) parentOf[m[1]] = cur;
    }
    if(d.length) dirs = d;
    if(r.length) roots = r;
  }
  // 「五、类型速查表」：每行 | `type` | 目录 | frontmatter | 正文结构 |；目录里的子目录（如 C-Strategies）归到它的顶层目录，xxx.md 表示根目录
  let schema = null;
  const sec = /##[^\n]*类型速查表[^\n]*\n([\s\S]*?)(?=\n##\s|\n---|$)/.exec(text);
  if(sec){
    const sc = {};
    for(const line of sec[1].split('\n')){
      const cells = line.split('|').slice(1, -1).map(c => c.trim());
      if(cells.length < 3) continue;
      const types = [...cells[0].matchAll(/`([a-z]+)`/g)].map(m => m[1]);
      if(!types.length) continue;
      const locs = [...cells[1].matchAll(/[0-9A-Z][^\s/→`|<>]*/g)].map(m => m[0]);
      const tops = [...new Set(locs.map(x => /\.\w+$/.test(x) ? '' : (parentOf[x] || x)))];
      const keys = cells[2].split(/[,，、]/).map(k => k.trim()).filter(k => /^[a-z]+$/.test(k));
      types.forEach(t => sc[t] = {dirs:tops, keys});
    }
    if(Object.keys(sc).length) schema = sc;
  }
  const goal = row('goal'), field = row('field'), emo = row('emotiontype'), status = row('status');
  KNOWN_TOP = dirs || DEFAULT_TOP;
  ROOT_FILES = roots || DEFAULT_ROOT;
  SCHEMA = schema || DEFAULT_SCHEMA;
  EMOTIONS = emo || DEFAULT_EMOTIONS;
  STATUS = status || DEFAULT_STATUS;
  GOALS = goal || [];
  FIELDS = field || [];
  const missing = [!f && 'CLAUDE.md', f && !dirs && '目录结构', f && !schema && '类型速查表', f && !goal && 'goal', f && !field && 'field',
    f && !emo && 'emotiontype', f && !status && 'status'].filter(Boolean);
  return {found:!!f, missing};
}

/* 策略开头的等级区（CLAUDE.md 6.10），三行：
   > 🟡 部分验证 · 出现 3 次 · 执行 2 次（有效 1 / 无效 0 / 未记录 1）· 更新 2026-10-16
   > 出现：[[记录A]]（日期）· …
   > 执行：[[记录B]]（日期，有效）· …
   只照抄 AI 写的等级，另外核对次数、链接数和等级对不对得上；多步策略有一步没执行时封顶在「部分验证」，第一行末尾注明「缺第 N 步」 */
function parseGrade(f){
  const head = f.body.split(/^##\s/m)[0];
  const m = /^[ \t]*>.*?(存疑|待验证|部分验证|已验证).*$/m.exec(head);
  const old = /(部分转正|转正|发育中)/.exec(f.body);
  if(!m || !/出现\s*\d+\s*次/.test(m[0]))
    return {level:null, legacy: m && /验证\s*\d+\s*次/.test(m[0]) ? '验证 N 次（支持 / 反例），10-14 旧写法' : old ? old[1] : ''};
  const line = m[0], level = m[1];
  const num = re => { const x = re.exec(line); return x ? +x[1] : null; };
  const ap = num(/出现\s*(\d+)\s*次/), ex = num(/执行\s*(\d+)\s*次/);
  const ok = num(/有效\s*(\d+)/), bad = num(/无效\s*(\d+)/), un = num(/未记录\s*(\d+)/);
  const up = parseDate((/更新\s*(\d{4}-\d{2}-\d{2})/.exec(line) || [])[1]);
  const gap = (/缺第[^·]*?步/.exec(line) || [''])[0];
  const links = label => {
    const x = new RegExp('^[ \\t]*>\\s*' + label + '[：:](.*)$', 'm').exec(head);
    if(!x) return null;
    return x[1].trim() === '无' ? 0 : (x[1].match(/\[\[/g) || []).length;
  };
  const la = links('出现'), le = links('执行');
  const issues = [];
  if(ex == null || ok == null || bad == null || un == null) issues.push('没写执行次数或有效 / 无效 / 未记录');
  else {
    if(ex !== ok + bad + un) issues.push(`执行 ${ex} 次 ≠ 有效 ${ok} + 无效 ${bad} + 未记录 ${un}`);
    const exp = bad >= 1 && bad >= ok ? '存疑' : ok === 0 ? '待验证' : ok <= 2 ? '部分验证' : '已验证';
    if(exp !== level && !(level === '部分验证' && exp === '已验证' && gap))
      issues.push(level === '部分验证' && exp === '已验证' ? '按次数应为「已验证」；若是多步封顶，第一行要注明缺第几步' : `按次数应为「${exp}」`);
  }
  if(la == null) issues.push('缺「出现：」那一行');
  else if(ap != null && la !== ap) issues.push(`出现写 ${ap} 次，链接 ${la} 个`);
  if(le == null) issues.push('缺「执行：」那一行');
  else if(ex != null && le !== ex) issues.push(`执行写 ${ex} 次，链接 ${le} 个`);
  return {level, n:ap, ap, ex, ok, bad, un, up, gap, issues};
}

/* ================= 模型 ================= */
function buildModel(raw){
  const rules = loadRules(raw);
  const files = raw.files.map(f => {
    const {fm, body} = parseFrontmatter(f.text);
    const parts = f.path.split('/');
    return {
      path:f.path, base:parts[parts.length-1].replace(/\.md$/i, ''), top:parts.length > 1 ? parts[0] : '',
      fm, body, type: typeof fm.type === 'string' ? fm.type : '', mtime:f.mtime,
      created:parseDate(fm.created), updated:parseDate(fm.updated),
    };
  }).sort((a, b) => a.path.localeCompare(b.path, 'zh'));
  const by = t => files.filter(f => f.type === t);
  const projects = files.filter(f => f.type === 'project' && f.top === 'A-Projects');
  const holidays = files.filter(f => f.type === 'holiday' && f.top === 'A-Holidays');
  const archived = files.filter(f => (f.type === 'project' || f.type === 'holiday') && f.top === 'A-Archive');
  for(const p of [...projects, ...holidays, ...archived]){ p.tasks = extractTasks(p); p.logs = extractLogs(p); }
  for(const h of holidays) h.boxes = extractTableBoxes(h);
  const strategies = by('strategy');
  for(const s of strategies) s.grade = parseGrade(s);
  const goals = new Set(GOALS);
  [...projects, ...archived].forEach(p => { const g = wl(p.fm.goal); if(g) goals.add(g); });
  return {
    files, projects, holidays, archived, goals, rules, dirs:raw.dirs || [], noDirInfo:!!raw.noDirInfo,
    moods:by('emotion'), insights:by('insight'), dialogues:by('dialogue'), topics:by('topic'),
    strategies, situations:by('situation'), memoirs:by('memoir'),
    profile:files.find(f => f.type === 'profile' && !f.top) || null,
    unclear:files.filter(f => f.top === '0-Unclear'), inbox:files.filter(f => f.top === '0-Inbox'),
  };
}

/* ================= 渲染：总入口 ================= */
function subline(t){
  const h = new Date().getHours();
  const greet = h < 5 ? '夜深了' : h < 11 ? '早上好' : h < 13 ? '中午好' : h < 18 ? '下午好' : '晚上好';
  const q = Math.floor(t.getMonth() / 3) + 1;
  const qEnd = new Date(t.getFullYear(), q * 3, 0);
  return `${t.getFullYear()}年${t.getMonth()+1}月${t.getDate()}日 周${WEEK[t.getDay()]} · ${greet} · Q${q} 还剩 ${dd(t, qEnd)} 天`;
}

function render(){
  const M = state.model; if(!M) return;
  const t = today();
  $('#sub').textContent = subline(t);
  const live = M.projects.filter(p => p.fm.status !== 'done');
  const active = live.filter(p => p.fm.status === 'active');
  const planned = live.filter(p => p.fm.status === 'planned');
  const trips = M.holidays.filter(h => h.fm.status !== 'done');
  const openDue = [...live, ...trips].flatMap(p => p.tasks.filter(x => !x.done && x.due)).sort((a, b) => a.due - b.due);
  const nextTrip = trips.map(h => ({h, start:parseDate(h.fm.start)})).filter(x => x.start && dd(t, x.start) >= 0).sort((a, b) => a.start - b.start)[0];
  const overdue = openDue.filter(x => dd(t, x.due) < 0);
  const soon = openDue.filter(x => { const n = dd(t, x.due); return n >= 0 && n <= 7; });
  const stale = active.filter(p => p.updated && dd(p.updated, t) > 14).map(p => ({p, days:dd(p.updated, t)})).sort((a, b) => b.days - a.days);
  const debt = computeDebt(M, t);

  const tile = (label, value, foot) => `<div class="card tile"><div class="label">${label}</div><div class="value">${value}</div><div class="foot">${foot}</div></div>`;
  const tiles = `<section class="tiles" style="margin-top:0">
    ${tile('活项目', active.length, `另有 planned ${planned.length} · 归档 ${M.archived.length}`)}
